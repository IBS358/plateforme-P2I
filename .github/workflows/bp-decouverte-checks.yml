name: BP Découverte — contrôles de non-régression

on:
  push:
    branches:
      - refonte-bp-decouverte-17-rubriques
    paths:
      - 'bp-decouverte-consultation*.html'
      - 'bp-decouverte-v108-source.html'
      - 'business-plan-decouverte-v108.html'
      - 'css/p2i-bp-decouverte-v108.css'
      - 'assets/bp-v108/**'
      - 'js/vendor/**'
      - 'tests/check-p2i-bp-v108.cjs'
      - 'tests/qa-bp-v108-browser.cjs'
      - 'bp-decouverte-v107-source.html'
      - 'business-plan-decouverte-v107.html'
      - 'css/p2i-bp-decouverte-v107.css'
      - 'assets/bp-v107/**'
      - 'tests/check-p2i-bp-v107.cjs'
      - 'tests/qa-bp-v107-browser.cjs'
      - 'package*.json'
      - 'tests/qa-bp-decouverte-dom.cjs'
      - 'tests/check-p2i-bp-publication.cjs'
      - 'scripts/*bp-decouverte*.cjs'
      - 'data/p2i-bp-decouverte-publication.json'
      - 'data/p2i-bp-decouverte-donnees.json'
      - 'data/p2i-bp-decouverte-96-dossiers-17-rubriques.json'
      - 'tests/check-p2i-bp-donnees.cjs'
      - 'business-plan-decouverte.html'
      - 'business-plan-pro.html'
      - 'fiche-production.html'
      - 'dashboard.html'
      - 'js/p2i-bp-passage-pro.js'
      - 'tests/qa-parcours-decouverte-pro.cjs'
      - 'css/p2i-bp-decouverte-17.css'
      - 'js/p2i-bp-decouverte-*.js'
      - 'js/p2i-financial-display.js'
      - 'tests/check-bp-decouverte-*.cjs'
      - 'tests/check-p2i-reference-coverage.cjs'
      - 'tests/check-p2i-bp-preparation.cjs'
      - 'tests/check-p2i-bp-lots.cjs'
      - 'tests/check-p2i-bp-lot-01.cjs'
      - 'tests/check-p2i-bp-tous-lots.cjs'
      - 'tests/check-p2i-bp-financial-validation.cjs'
      - 'tests/check-p2i-bp-bfr-engine.cjs'
      - 'js/p2i-bp-decouverte-bfr-engine.js'
      - 'tests/check-p2i-bp-bfr-36.cjs'
      - 'js/p2i-bp-decouverte-bfr-36.js'
      - 'tests/check-p2i-bp-assembleur-previsions.cjs'
      - 'js/p2i-bp-decouverte-assembleur-previsions.js'
      - 'tests/check-p2i-bp-tresorerie-12-mois.cjs'
      - 'js/p2i-bp-decouverte-tresorerie-12-mois.js'
      - 'tests/check-p2i-bp-validated-projections.cjs'
      - 'js/p2i-bp-decouverte-dossier-builder.js'
      - 'scripts/build-bp-decouverte-95-dossiers.cjs'
      - 'scripts/build-bp-decouverte-plan-consolidation.cjs'
      - 'tests/check-p2i-bp-95-dossiers.cjs'
      - 'tests/check-p2i-bp-readiness-gates.cjs'
      - 'data/p2i-bp-decouverte-96-dossiers-17-rubriques.json'
      - 'tests/check-p2i-bp-script-loading.cjs'
      - 'tests/check-p2i-bp-bfr-scenario-assembleur.cjs'
      - 'js/p2i-bp-decouverte-bfr-engine.js'
      - 'js/p2i-bp-decouverte-17-validated-projections.js'
      - 'js/p2i-bp-decouverte-financial-validation.js'
      - 'js/p2i-bp-decouverte-bfr-36-mois.js'
      - 'tests/check-p2i-bp-bfr-36-mois.cjs'
      - 'scripts/build-bp-decouverte-tous-lots.cjs'
      - 'data/p2i-bp-decouverte-lot-*-sources.json'
      - 'scripts/build-bp-decouverte-lot-01.cjs'
      - 'data/p2i-bp-decouverte-lot-01-sources.json'
      - 'scripts/build-bp-decouverte-lots.cjs'
      - 'data/p2i-bp-decouverte-lots.json'
      - 'js/p2i-bp-decouverte-preparation.js'
      - 'up-data.js'
      - 'machines-data.js'
      - '.github/workflows/bp-decouverte-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrôles statiques et syntaxiques
        run: node tests/check-bp-decouverte-17.cjs
      - name: Scénarios dynamiques du pont financier
        run: node tests/check-bp-decouverte-bridge.cjs
      - name: Couverture des UP et correspondance catalogue
        run: node tests/check-p2i-reference-coverage.cjs
      - name: Audit de préparation des BP Découverte
        run: node tests/check-p2i-bp-preparation.cjs
      - name: Vérifier le registre des lots BP Découverte
        run: |
          node tests/check-p2i-bp-lots.cjs
          node scripts/build-bp-decouverte-lots.cjs
          git diff --exit-code -- data/p2i-bp-decouverte-lots.json
      - name: Vérifier les huit fiches sources agroalimentaires
        run: |
          node tests/check-p2i-bp-lot-01.cjs
          node scripts/build-bp-decouverte-lot-01.cjs
          git diff --exit-code -- data/p2i-bp-decouverte-lot-01-sources.json
      - name: Vérifier les dossiers sources des douze filières
        run: |
          node tests/check-p2i-bp-tous-lots.cjs
          node scripts/build-bp-decouverte-tous-lots.cjs
          git diff --exit-code -- data/p2i-bp-decouverte-lot-*-sources.json
      - name: Contrôler le contrat financier commun
        run: node tests/check-p2i-bp-financial-validation.cjs
      - name: Raccordement des prévisions validées aux rubriques
        run: node tests/check-p2i-bp-validated-projections.cjs
      - name: Moteur de trésorerie mensuelle
        run: node tests/check-p2i-bp-tresorerie-12-mois.cjs
      - name: Moteur BFR mensuel sur 36 mois
        run: node tests/check-p2i-bp-bfr-36-mois.cjs
      - name: Assemblage et publication des prévisions BP Découverte
        run: node tests/check-p2i-bp-assembleur-previsions.cjs
      - name: Contrôler le moteur BFR mensuel sur 36 mois
        run: node tests/check-p2i-bp-bfr-36.cjs
      - name: Vérifier le moteur BFR sur 36 mois
        run: node tests/check-p2i-bp-bfr-engine.cjs
      - name: Contrôler le chargement unique des scripts financiers
        run: node tests/check-p2i-bp-script-loading.cjs
      - name: Vérifier le scénario BFR 40/60 raccordé à la trésorerie
        run: node tests/check-p2i-bp-bfr-scenario-assembleur.cjs
      - name: Vérifier les portes de publication et les manques réels
        run: node tests/check-p2i-bp-readiness-gates.cjs
      - name: Contrôler les 95 dossiers documentaires à 17 rubriques
        run: |
          node tests/check-p2i-bp-95-dossiers.cjs
          node scripts/build-bp-decouverte-95-dossiers.cjs
          git diff --exit-code -- data/p2i-bp-decouverte-96-dossiers-17-rubriques.json

      - name: Générer la matrice de consolidation des 95 UP
        run: node scripts/build-bp-decouverte-plan-consolidation.cjs
      - name: Conserver la matrice de consolidation CSV
        uses: actions/upload-artifact@v4
        with:
          name: p2i-bp-decouverte-plan-consolidation
          path: data/p2i-bp-decouverte-plan-consolidation.csv
          retention-days: 30

      - name: Contrôler les preuves et les 99 configurations
        run: |
          node tests/check-p2i-bp-publication.cjs
          node scripts/audit-bp-decouverte-publication.cjs
          git diff --exit-code -- data/p2i-bp-decouverte-publication.json
      - name: Vérifier le paquet autonome reproductible
        run: |
          node scripts/build-bp-decouverte-consultation.cjs
          git diff --exit-code -- bp-decouverte-consultation-autonome.html
      - name: Installer les outils de recette DOM
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Vérifier les parcours de consultation et le paquet autonome
        run: |
          npm run test:dom
          P2I_QA_ENTRY=bp-decouverte-consultation-autonome.html npm run test:dom

      - name: Vérifier les calculs et la construction V107
        run: |
          node tests/check-p2i-bp-v107.cjs
          node scripts/build-bp-decouverte-v107.cjs
          git diff --exit-code -- business-plan-decouverte-v107.html
      - name: Installer Chromium pour la recette réelle V107
        run: npx playwright install --with-deps chromium
      - name: Recette navigateur V107
        run: npm run test:browser-v107

      - name: Vérifier la restauration et la construction V108
        run: |
          node tests/check-p2i-bp-v108.cjs
          node scripts/build-bp-decouverte-v108.cjs
          git diff --exit-code -- business-plan-decouverte.html business-plan-decouverte-v108.html js/vendor/p2i-supabase-v108.min.js
      - name: Recette navigateur V108
        run: npm run test:browser-v108

      - name: Recette du parcours Découverte vers Pro
        run: npm run test:parcours

      - name: Vérifier le référentiel économique et rédactionnel des 96 UP
        run: |
          node tests/check-p2i-bp-donnees.cjs
          node scripts/build-bp-decouverte-donnees.cjs
          git diff --exit-code -- data/p2i-bp-decouverte-donnees.json js/p2i-bp-decouverte-donnees.js
