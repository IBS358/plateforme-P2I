            .filters input {
                width: 100%;
                min-width: unset;
            }

            .relation-header {
                flex-direction: column;
                align-items: stretch;
            }

            .toast {
                white-space: normal;
                text-align: center;
                width: 90%;
            }
        }

</head>

    function showAccessDenied(message) {

        const container =
            document.getElementById('mainContainer');

        container.innerHTML = `
            <div class="access-denied">

    // ============================================================
    // HELPERS
    // ============================================================

    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return '';
        }

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }


    function formatDateFR(iso) {

        try {

            if (!iso) {
                return '—';
            }

            return new Date(iso).toLocaleString(
                'fr-FR',
                {
                    dateStyle: 'short',
                    timeStyle: 'short'
                }
            );

        } catch (e) {

            return '—';
        }
    }


    function showToast(message, isError = false) {

        const toast =
            document.getElementById('toast');

        if (!toast) return;

        toast.textContent = message;

        toast.className =
            'toast' + (isError ? ' error' : '');

        toast.style.opacity = '1';

        clearTimeout(toast._timeout);

        toast._timeout = setTimeout(() => {

            toast.style.opacity = '0';

        }, 3000);
    }

        // ========================================================
        // 1. RÉCUPÉRATION DES DEMANDES
        // ========================================================

        const {
            data,
            error
        } = await supabaseClient
            .from('user_contacts')
            .select(`
                id,
                user_id,
                product_name,
                supplier_name,
                origin,
                model_id,
                status,
                created_at
            `)
            .order(
                'created_at',
                {
                    ascending: false
                }
            );


        // ========================================================
        // 2. VÉRIFICATION DE L'ERREUR SUPABASE
        // ========================================================

        if (error) {

            console.error(
                '❌ Erreur Supabase user_contacts :',
                error
            );

            container.innerHTML = `
                <div class="empty-state">

                    <span class="icon">❌</span>

                    <p>
                        Impossible de charger les demandes.
                    </p>

                    <p style="
                        font-size:0.8rem;
                        margin-top:8px;
                        color:#64748b;
                    ">
                        ${escapeHtml(error.message || '')}
                    </p>

                </div>
            `;

            return;
        }


        console.log(
            '✅ Connexion à user_contacts réussie.',
            data
        );

        console.log(
            `📊 ${data ? data.length : 0} demande(s) trouvée(s).`
        );


        // ========================================================
        // 3. TRANSFORMATION DES DONNÉES
        // ========================================================

        allRelations =
            (data || []).map(row => {

                return {

                    id: row.id,

                    userId: row.user_id,

                    product:
                        row.product_name ||
                        'Produit non spécifié',

                    supplier:
                        row.supplier_name ||
                        'Fournisseur non précisé',

                    origin:
                        row.origin || '',

                    modelId:
                        row.model_id || '',

                    status:
                        row.status || 'pending',

                    createdAt:
                        row.created_at,

                    date:
                        row.created_at,

                    userDisplayName:
                        'Utilisateur',

                    telephone:
                        '',

                    role:
                        '',

                    internalNotes:
                        [],

                    machineDetails:
                        {}

                };

            });


        // ========================================================
        // 4. RÉCUPÉRATION DES PROFILS UTILISATEURS
        // ========================================================

        const uniqueUserIds = [
            ...new Set(
                allRelations
                    .map(relation => relation.userId)
                    .filter(Boolean)
            )
        ];


        console.log(
            '👤 Utilisateurs à rechercher :',
            uniqueUserIds
        );


        if (uniqueUserIds.length > 0) {

            const {
                data: profiles,
                error: profilesError
            } = await supabaseClient
                .from('profiles')
                .select(`
                    id,
                    full_name,
                    telephone,
                    role
                `)
                .in(
                    'id',
                    uniqueUserIds
                );


            if (profilesError) {

                console.warn(
                    '⚠️ Impossible de récupérer les profils :',
                    profilesError
                );

                /*
                 * Ce n'est PAS bloquant.
                 *
                 * Les demandes restent affichées même si
                 * les profils ne peuvent pas être récupérés.
                 */

            } else if (profiles) {

                const profileMap = {};


                profiles.forEach(profile => {

                    profileMap[profile.id] =
                        profile;

                });


                allRelations =
                    allRelations.map(relation => {

                        const profile =
                            profileMap[
                                relation.userId
                            ];


                        if (profile) {

                            relation.userDisplayName =
                                profile.full_name ||
                                'Utilisateur';

                            relation.telephone =
                                profile.telephone ||
                                '';

                            relation.role =
                                profile.role ||
                                '';
                        }


                        return relation;

                    });
            }
        }


        // ========================================================
        // 5. AFFICHAGE DES DEMANDES
        // ========================================================

        console.log(
            '✅ Demandes prêtes pour affichage :',
            allRelations
        );


        renderRelations();


    } catch (error) {

        console.error(
            '❌ Erreur inattendue chargement relations :',
            error
        );


        container.innerHTML = `
            <div class="empty-state">

                <span class="icon">❌</span>

                <p>
                    Impossible de charger les demandes.
                </p>

                <p style="
                    font-size:0.8rem;
                    margin-top:8px;
                    color:#64748b;
                ">
                    ${escapeHtml(
                        error.message ||
                        'Erreur inconnue'
                    )}
                </p>

            </div>
        `;
    }
}

    // ============================================================
    // CHARGEMENT DE SECOURS SANS JOINTURE PROFILES
    // ============================================================

    async function loadRelationsWithoutProfile() {

        try {

            const {
                data,
                error
            } = await supabaseClient
                .from('user_contacts')
                .select(`
                    id,
                    user_id,
                    product_name,
                    supplier_name,
                    origin,
                    model_id,
                    status,
                    created_at
                `)
                .order(
                    'created_at',
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    '❌ Erreur chargement user_contacts:',
                    error
                );

                showToast(
                    '❌ Impossible de charger les demandes.',
                    true
                );

                return;
            }


            allRelations =
                (data || []).map(row => {

                    return {

                        id: row.id,

                        userId: row.user_id,

                        product: row.product_name,

                        supplier: row.supplier_name,

                        origin: row.origin,

                        modelId: row.model_id,

                        status:
                            row.status || 'pending',

                        createdAt: row.created_at,

                        date: row.created_at,

                        userDisplayName:
                            'Utilisateur',

                        telephone: '',

                        role: '',

                        internalNotes: [],

                        machineDetails: {}

                    };

                });


            /*
             * On récupère ensuite les profils individuellement.
             */

            const uniqueUserIds = [
                ...new Set(
                    allRelations
                        .map(r => r.userId)
                        .filter(Boolean)
                )
            ];


            if (uniqueUserIds.length > 0) {

                const {
                    data: profiles,
                    error: profilesError
                } = await supabaseClient
                    .from('profiles')
                    .select(
                        'id, full_name, telephone, role'
                    )
                    .in(
                        'id',
                        uniqueUserIds
                    );


                if (!profilesError && profiles) {

                    const profileMap = {};

                    profiles.forEach(profile => {

                        profileMap[profile.id] =
                            profile;

                    });


                    allRelations =
                        allRelations.map(rel => {

                            const profile =
                                profileMap[rel.userId];

                            if (profile) {

                                rel.userDisplayName =
                                    profile.full_name ||
                                    'Utilisateur';

                                rel.telephone =
                                    profile.telephone ||
                                    '';

                                rel.role =
                                    profile.role ||
                                    '';
                            }

                            return rel;

                        });
                }
            }


            renderRelations();


        } catch (error) {

            console.error(
                '❌ Erreur fallback profiles:',
                error
            );

            showToast(
                '❌ Erreur lors du chargement.',
                true
            );
        }
    }


    // ============================================================
    // FILTRES
    // ============================================================

    function applyFilters() {

        currentFilter =
            document.getElementById(
                'filterStatus'
            ).value;


        currentSearch =
            document.getElementById(
                'filterSearch'
            ).value
            .toLowerCase()
            .trim();


        renderRelations();
    }


    // ============================================================
    // AFFICHAGE
    // ============================================================

    function renderRelations() {

        const container =
            document.getElementById(
                'relationsList'
            );


        updateStats(allRelations);


        let filtered =
            [...allRelations];


        // Filtre statut
        if (currentFilter !== 'all') {

            filtered =
                filtered.filter(
                    r =>
                        r.status === currentFilter
                );
        }


        // Recherche
        if (currentSearch) {

            filtered =
                filtered.filter(rel => {

                    const searchStr = [

                        rel.product,

                        rel.supplier,

                        rel.userDisplayName,

                        rel.userId,

                        rel.modelId,

                        rel.origin,

                        rel.telephone

                    ]
                    .filter(Boolean)
                    .join(' ')
                    .toLowerCase();


                    return searchStr.includes(
                        currentSearch
                    );
                });
        }


        // Tri : plus récent en premier
        filtered.sort(
            (a, b) =>
                new Date(
                    b.createdAt || 0
                ) -
                new Date(
                    a.createdAt || 0
                )
        );


        if (filtered.length === 0) {

            container.innerHTML = `
                <div class="empty-state">

                    <span class="icon">📭</span>

                    <p>
                        Aucune demande de mise en relation
                    </p>

                    <p style="
                        font-size:0.8rem;
                        margin-top:8px;
                        color:#64748b;
                    ">
                        Les demandes apparaîtront ici
                        lorsqu'un utilisateur en fera.
                    </p>

                </div>
            `;

            return;
        }


        container.innerHTML =
            filtered.map(rel => {

                const statusInfo =
                    STATUS_LABELS[
                        rel.status
                    ] ||
                    STATUS_LABELS.pending;


                const originLabel =
                    ORIGIN_LABELS[
                        rel.origin
                    ] ||
                    rel.origin ||
                    '🌍 Non précisée';


                const userDisplay =
                    rel.userDisplayName ||
                    'Utilisateur';


                return `

                    <div class="relation-card"
                         data-id="${escapeHtml(rel.id)}">

                        <div class="relation-header">

                            <div>

                                <div class="relation-product">
                                    ${escapeHtml(
                                        rel.product ||
                                        'Produit non spécifié'
                                    )}
                                </div>

                                <div class="relation-user">

                                    <i class="fas fa-user"></i>

                                    ${escapeHtml(
                                        userDisplay
                                    )}

                                    <span style="
                                        color:#64748b;
                                        font-size:0.75rem;
                                        display:block;
                                        margin-top:3px;
                                    ">
                                        ID :
                                        ${escapeHtml(
                                            rel.userId
                                        )}
                                    </span>

                                    ${
                                        rel.telephone
                                            ? `
                                                <span style="
                                                    color:#64748b;
                                                    font-size:0.75rem;
                                                    display:block;
                                                    margin-top:3px;
                                                ">
                                                    <i class="fas fa-phone"></i>
                                                    ${escapeHtml(
                                                        rel.telephone
                                                    )}
                                                </span>
                                              `
                                            : ''
                                    }

                                </div>

                            </div>


                            <span class="
                                relation-status
                                ${statusInfo.class}
                            ">
                                ${statusInfo.label}
                            </span>

                        </div>


                        <div class="relation-meta">

                            <span>
                                <i class="fas fa-building"></i>

                                ${escapeHtml(
                                    rel.supplier ||
                                    'Fournisseur non précisé'
                                )}
                            </span>


                            <span>
                                ${originLabel}
                            </span>


                            <span>
                                <i class="fas fa-calendar-alt"></i>

                                ${formatDateFR(
                                    rel.createdAt
                                )}
                            </span>

                        </div>


                        <!-- Détails de la demande -->

                        <div class="machine-details">

                            <div class="machine-detail-item">

                                <span class="label">
                                    Modèle / ID
                                </span>

                                <span class="value">
                                    ${escapeHtml(
                                        rel.modelId ||
                                        'Non spécifié'
                                    )}
                                </span>

                            </div>


                            ${
                                rel.role
                                    ? `
                                        <div class="machine-detail-item">

                                            <span class="label">
                                                Rôle utilisateur
                                            </span>

                                            <span class="value">
                                                ${escapeHtml(
                                                    rel.role
                                                )}
                                            </span>

                                        </div>
                                      `
                                    : ''
                            }

                        </div>


                        <!-- Actions -->

                        <div class="relation-actions">


                            ${
                                rel.status === 'pending'
                                    ? `

                                        <button
                                            class="btn-action btn-contacting"
                                            onclick="changeStatus(
                                                ${rel.id},
                                                'contacting_supplier'
                                            )">

                                            📞 En attente réponse fournisseur

                                        </button>


                                        <button
                                            class="btn-action btn-contact"
                                            onclick="changeStatus(
                                                ${rel.id},
                                                'contacted'
                                            )">

                                            🤝 Passer en cours

                                        </button>

                                      `
                                    : ''
                            }


                            ${
                                rel.status === 'contacting_supplier'
                                    ? `

                                        <button
                                            class="btn-action btn-contacted"
                                            onclick="changeStatus(
                                                ${rel.id},
                                                'contacted'
                                            )">

                                            🤝 Passer en cours de discussion

                                        </button>

                                      `
                                    : ''
                            }


                            ${
                                rel.status === 'contacted'
                                    ? `

                                        <button
                                            class="btn-action btn-concluded"
                                            onclick="changeStatus(
                                                ${rel.id},
                                                'concluded'
                                            )">

                                            ✅ Partenariat établi

                                        </button>

                                      `
                                    : ''
                            }


                            ${
                                rel.status !== 'cancelled' &&
                                rel.status !== 'concluded'
                                    ? `

                                        <button
                                            class="btn-action btn-cancel"
                                            onclick="changeStatus(
                                                ${rel.id},
                                                'cancelled'
                                            )">

                                            ❌ Annuler

                                        </button>

                                      `
                                    : ''
                            }


                            <button
                                class="btn-action btn-add-note"
                                onclick="openNoteModal(
                                    ${rel.id}
                                )">

                                ✏️ Ajouter une note

                            </button>

                        </div>

                    </div>
                `;

            }).join('');
    }


    // ============================================================
    // STATISTIQUES
    // ============================================================

    function updateStats(relations) {

        document.getElementById(
            'statTotal'
        ).textContent =
            relations.length;


        document.getElementById(
            'statPending'
        ).textContent =
            relations.filter(
                r =>
                    r.status === 'pending'
            ).length;


        document.getElementById(
            'statContacting'
        ).textContent =
            relations.filter(
                r =>
                    r.status ===
                    'contacting_supplier'
            ).length;


        document.getElementById(
            'statContacted'
        ).textContent =
            relations.filter(
                r =>
                    r.status === 'contacted'
            ).length;


        document.getElementById(
            'statConcluded'
        ).textContent =
            relations.filter(
                r =>
                    r.status === 'concluded'
            ).length;
    }


    // ============================================================
    // MODIFICATION DU STATUT DANS SUPABASE
    // ============================================================

    async function changeStatus(id, newStatus) {

        const relation =
            allRelations.find(
                r => Number(r.id) === Number(id)
            );


        if (!relation) {

            showToast(
                '❌ Demande non trouvée',
                true
            );

            return;
        }


        const statusLabels = {

            pending:
                'en attente',

            contacting_supplier:
                'en attente réponse fournisseur',

            contacted:
                'en cours de discussion',

            concluded:
                'partenariat établi',

            cancelled:
                'annulée'
        };


        const confirmMsg =
            `Passer la demande "${relation.product}" ` +
            `en statut "${statusLabels[newStatus]}" ?`;


        if (!confirm(confirmMsg)) {
            return;
        }


        try {

            showToast(
                '⏳ Mise à jour en cours...'
            );


            const {
                error
            } = await supabaseClient
                .from('user_contacts')
                .update({
                    status: newStatus
                })
                .eq(
                    'id',
                    id
                );


            if (error) {

                console.error(
                    '❌ Erreur UPDATE statut:',
                    error
                );

                showToast(
                    '❌ Erreur lors de la mise à jour du statut.',
                    true
                );

                return;
            }


            /*
             * Mise à jour locale immédiate
             */

            relation.status =
                newStatus;


            showToast(
                `✅ Statut mis à jour : ${statusLabels[newStatus]}`
            );


            renderRelations();


        } catch (error) {

            console.error(
                '❌ Erreur inattendue:',
                error
            );

            showToast(
                '❌ Une erreur est survenue.',
                true
            );
        }
    }


    // ============================================================
    // NOTES INTERNES
    // ============================================================
    //
    // IMPORTANT :
    // La table user_contacts actuelle ne possède PAS de colonne
    // internal_notes.
    //
    // On ne tente donc PAS d'écrire les notes dans Supabase.
    //
    // Pour conserver cette fonctionnalité, il faudra créer une
    // table dédiée, par exemple admin_contact_notes.
    //
    // Pour le moment, le bouton affiche un avertissement.
    // ============================================================

    function openNoteModal(id) {

        noteTargetId = id;

        document.getElementById(
            'noteInput'
        ).value = '';


        document.getElementById(
            'noteModal'
        ).classList.add('active');
    }


    function closeNoteModal() {

        document.getElementById(
            'noteModal'
        ).classList.remove('active');


        noteTargetId = null;
    }


    async function saveNote() {

        const note =
            document.getElementById(
                'noteInput'
            ).value.trim();


        if (!note) {

            showToast(
                '⚠️ Veuillez saisir une note',
                true
            );

            return;
        }


        if (!noteTargetId) {

            showToast(
                '❌ Aucune demande ciblée',
                true
            );

            return;
        }


        /*
         * Ta table user_contacts ne possède actuellement
         * aucune colonne pour stocker les notes internes.
         *
         * On ne prétend donc pas enregistrer la note.
         */

        showToast(
            '⚠️ Les notes internes nécessitent une table Supabase dédiée.',
            true
        );


        closeNoteModal();
    }


    // ============================================================
    // FERMETURE DU MODAL
    // ============================================================

    const noteModal =
        document.getElementById(
            'noteModal'
        );


    if (noteModal) {

        noteModal.addEventListener(
            'click',
            function(e) {

                if (e.target === this) {

                    closeNoteModal();
                }

            }
        );
    }


    // ============================================================
    // ACTUALISATION AUTOMATIQUE
    // ============================================================

    /*
     * Permet de retrouver une nouvelle demande sans
     * avoir besoin de recharger manuellement la page.
     */

    let refreshTimer = null;


    function startAutoRefresh() {

        clearInterval(
            refreshTimer
        );


        refreshTimer =
            setInterval(
                async function() {

                    await loadRelations();

                },
                30000
            );
    }


    // ============================================================
    // INITIALISATION
    // ============================================================

    document.addEventListener(
        'DOMContentLoaded',
        async function() {

            console.log(
                '🚀 Initialisation admin-relations.html'
            );


            // Vérification administrateur
            const isAdmin =
                await checkAdminAccess();


            if (!isAdmin) {
                return;
            }


            // Chargement depuis Supabase
            await loadRelations();


            // Actualisation automatique
            startAutoRefresh();

        }
    );

</script>
