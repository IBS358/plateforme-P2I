<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentification | P2I</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

    body {
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-container {
      background: rgba(27, 38, 59, 0.85);
      backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 25px;
      border: 1px solid rgba(76, 201, 240, 0.2);
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .auth-header { text-align: center; margin-bottom: 25px; }

    .auth-header h2 {
      font-size: 2.2rem;
      background: linear-gradient(to right, #4cc9f0, #f72585);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 15px;
    }

    .role-selector {
      display: flex;
      background: rgba(255, 255, 255, 0.05);
      padding: 5px;
      border-radius: 50px;
      margin-bottom: 25px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .role-option {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #b8c1ec;
      transition: all 0.3s;
    }

    .role-option.active {
      background: #4cc9f0;
      color: #0d1b2a;
      box-shadow: 0 0 15px rgba(76, 201, 240, 0.4);
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      margin-bottom: 8px;
      color: #b8c1ec;
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
    }

    input:focus {
      border-color: #4cc9f0;
      background: rgba(255, 255, 255, 0.1);
      outline: none;
    }

    .btn-auth {
      width: 100%;
      padding: 16px;
      background: linear-gradient(to right, #4cc9f0, #4361ee);
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 10px;
    }

    .error-msg {
      color: #f72585;
      font-size: 0.9rem;
      margin-top: 15px;
      text-align: center;
      display: none;
      white-space: pre-line;
    }

    .success-msg {
      color: #4cc9f0;
      font-size: 0.9rem;
      margin-top: 15px;
      text-align: center;
      display: none;
      white-space: pre-line;
    }

    .loading-spinner {
      display: none;
      margin: 15px auto;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #4cc9f0;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .switch-mode {
      text-align: center;
      margin-top: 25px;
      font-size: 0.95rem;
      color: #b8c1ec;
    }

    .switch-mode span {
      color: #4cc9f0;
      cursor: pointer;
      font-weight: 600;
      text-decoration: underline;
    }

    .back-home {
      text-align: center;
      margin-top: 20px;
    }

    .back-home a {
      color: #b8c1ec;
      text-decoration: none;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <div class="auth-header">
      <h2 id="formTitle">Connexion</h2>

      <div class="role-selector">
        <div id="role-user" class="role-option active" onclick="setRole('user')">Utilisateur</div>
        <div id="role-entrepreneur" class="role-option" onclick="setRole('entrepreneur')">Entrepreneur</div>
      </div>
    </div>
    <div class="form-group" id="firstNameGroup" style="display:none;">
  <label>Prénom</label>
  <input type="text" id="firstName" placeholder="Votre prénom (facultatif)">
</div>

<div class="form-group" id="lastNameGroup" style="display:none;">
  <label>Nom</label>
  <input type="text" id="lastName" placeholder="Votre nom (facultatif)">
</div>
    <form id="authForm" novalidate>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="votre@email.com" required>
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-auth" id="submitBtn">Se connecter</button>

      <div class="loading-spinner" id="spinner"></div>
      <div id="errorDisplay" class="error-msg"></div>
      <div id="successDisplay" class="success-msg"></div>
    </form>

    <div class="switch-mode">
      <p id="toggleText">Pas encore de compte ? <span onclick="toggleMode()">S'inscrire</span></p>
    </div>

    <div class="back-home">
      <a href="index.html">← Retour à l'accueil</a>
    </div>
  </div>

  <script>
  const SUPABASE_URL = 'https://cfbbpmxdtiuicaitssjp.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmYmJwbXhkdGl1aWNhaXRzc2pwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg4MzQ5MjUsImV4cCI6MjA4NDQxMDkyNX0._wukYnxJ27JJgW_YTU_m88YKNBVzAQFpMjBP7t8zT18';

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: false,
      detectSessionInUrl: false
    }
  });

  const params = new URLSearchParams(window.location.search);
  let currentRole = params.get('role') || 'user';
  let isLogin = (params.get('mode') !== 'register');

  function setRole(role) {
    currentRole = role;
    document.getElementById('role-user')?.classList.toggle('active', role === 'user');
    document.getElementById('role-entrepreneur')?.classList.toggle('active', role === 'entrepreneur');
  }

  function toggleMode() {
    isLogin = !isLogin;
    updateUI();
    hideMessages();
  }

  function updateUI() {
    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    const toggleText = document.getElementById('toggleText');
    const firstNameGroup = document.getElementById('firstNameGroup');
    const lastNameGroup = document.getElementById('lastNameGroup');

    if (formTitle) formTitle.innerText = isLogin ? 'Connexion' : 'Inscription';
    if (submitBtn) submitBtn.innerText = isLogin ? 'Se connecter' : 'Créer mon compte';

    if (toggleText) {
      toggleText.innerHTML = isLogin
        ? "Pas encore de compte ? <span onclick='toggleMode()'>S'inscrire</span>"
        : "Déjà un compte ? <span onclick='toggleMode()'>Se connecter</span>";
    }

    const displayMode = isLogin ? 'none' : 'block';
    if (firstNameGroup) firstNameGroup.style.display = displayMode;
    if (lastNameGroup) lastNameGroup.style.display = displayMode;
  }

  function showMessage(id, msg) {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerText = msg;
    el.style.display = 'block';
  }

  function hideMessages() {
    const err = document.getElementById('errorDisplay');
    const ok = document.getElementById('successDisplay');

    if (err) {
      err.style.display = 'none';
      err.innerText = '';
    }

    if (ok) {
      ok.style.display = 'none';
      ok.innerText = '';
    }
  }

  function normalizeEmail(value) {
    return String(value || '').trim().toLowerCase();
  }

  function saveUserProfileLocally(profile) {
    try {
      const existingLocal = JSON.parse(localStorage.getItem('userP2I') || '{}');
      const existingSession = JSON.parse(sessionStorage.getItem('userP2I') || '{}');

      const merged = {
        ...existingLocal,
        ...existingSession,
        ...profile
      };

      localStorage.setItem('userP2I', JSON.stringify(merged));
      sessionStorage.setItem('userP2I', JSON.stringify(merged));
    } catch (e) {
      console.warn('Impossible de sauvegarder userP2I localement :', e);
    }
  }

  async function testSupabaseNetwork() {
    try {
      const res = await fetch(SUPABASE_URL + '/auth/v1/health', { method: 'GET' });
      console.log('Supabase health OK:', res.status);
      return true;
    } catch (e) {
      console.error('Supabase health failed:', e);
      return false;
    }
  }

  async function enrichLocalProfileFromSession() {
    try {
      const { data, error } = await sb.auth.getUser();
      if (error) throw error;

      const user = data?.user;
      if (!user) return;

      const md = user.user_metadata || {};

      saveUserProfileLocally({
        id: user.id || '',
        email: normalizeEmail(user.email || ''),
        first_name: String(md.first_name || '').trim(),
        last_name: String(md.last_name || '').trim(),
        role: String(md.role || currentRole || 'user').trim(),
        updated_at: new Date().toISOString()
      });
    } catch (e) {
      console.warn('Impossible de récupérer le profil Supabase :', e);
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    setRole(currentRole);
    updateUI();
  });

  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMessages();

    const email = normalizeEmail(document.getElementById('email')?.value);
    const password = document.getElementById('password')?.value || '';
    const firstName = String(document.getElementById('firstName')?.value || '').trim();
    const lastName = String(document.getElementById('lastName')?.value || '').trim();
    const btn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');

    if (!email || !password) {
      showMessage('errorDisplay', "Email et mot de passe obligatoires.");
      return;
    }

    btn.disabled = true;
    spinner.style.display = 'block';

    try {
      const networkOk = await testSupabaseNetwork();
      if (!networkOk) {
        throw new Error("Connexion réseau à Supabase impossible dans cet environnement. Le problème ne vient probablement pas du mot de passe mais du mode preview / webview.");
      }

      if (isLogin) {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;

        localStorage.setItem("p2i_user_email", email);
        sessionStorage.setItem("p2i_user_email", email);
        localStorage.setItem("p2i_active_user", email);
        localStorage.setItem("p2i_user_logged_in", "true");
        localStorage.setItem("p2i_is_logged_in", "1");
        sessionStorage.setItem("p2i_is_logged_in", "1");

        await enrichLocalProfileFromSession();

        showMessage('successDisplay', "Connexion réussie !");

        setTimeout(() => {
          (function setActiveUserSafely() {
            try {
              const emailLS = normalizeEmail(localStorage.getItem("p2i_user_email"));
              if (emailLS) {
                localStorage.setItem("p2i_active_user", emailLS);
                localStorage.setItem("p2i_user_logged_in", "true");
                localStorage.setItem("p2i_is_logged_in", "1");
                sessionStorage.setItem("p2i_is_logged_in", "1");
              } else {
                localStorage.setItem("p2i_active_user", "");
              }
            } catch (_) {}
          })();

          let pending = null;
          try {
            pending = JSON.parse(localStorage.getItem("p2i_pending_action") || "null");
          } catch (_) {
            pending = null;
          }

          if (pending && pending.action === "bp_gratuit") {
            try {
              if (pending.unit_id) localStorage.setItem("currentUnitId", pending.unit_id);
              if (pending.unit_name) localStorage.setItem("currentUnitName", pending.unit_name);
              if (pending.filiere) localStorage.setItem("currentFiliereName", pending.filiere);

              const activeEmail = normalizeEmail(localStorage.getItem("p2i_active_user"));
              const downloadsKey = activeEmail
                ? `p2i_downloads__${activeEmail}`
                : "p2i_downloads__guest";

              const unitId = pending.unit_id || "";
              const unitName = pending.unit_name || "Unité de Production";
              const filiere = pending.filiere || "";
              const bpUrl =
                pending.file_url ||
                pending.bp_url ||
                (unitId
                  ? `business-plan-decouverte.html?unit_id=${encodeURIComponent(unitId)}`
                  : "business-plan-decouverte.html");

              const code = pending.code || ("P2I-BP-" + (unitId || "TEMP"));

              let downloads = [];
              try {
                downloads = JSON.parse(localStorage.getItem(downloadsKey) || "[]");
                if (!Array.isArray(downloads)) downloads = [];
              } catch (_) {
                downloads = [];
              }

              const exists = downloads.some(item =>
                item &&
                item.type === "bp_gratuit" &&
                String(item.code || "") === String(code)
              );

              if (!exists) {
                downloads.unshift({
                  type: "bp_gratuit",
                  code,
                  unit_id: unitId,
                  unit: unitName,
                  filiere,
                  date: new Date().toISOString(),
                  url: bpUrl,
                  mode: "web_preview",
                  status: "disponible"
                });
              }

              localStorage.setItem(downloadsKey, JSON.stringify(downloads));
              localStorage.removeItem("p2i_pending_action");
              localStorage.removeItem("p2i_downloads");
              localStorage.removeItem("p2i_downloads__guest");

              window.location.href = bpUrl;
              return;
            } catch (e) {
              console.error("Erreur redirection BP gratuit après connexion :", e);
            }
          }

          const pendingRaw = localStorage.getItem("pending_bp");

          if (pendingRaw) {
            try {
              const pendingOld = JSON.parse(pendingRaw);
              const url = new URL(
                pendingOld.return_to || `fiche-production.html?id=${pendingOld.up_id}`,
                window.location.origin
              );
              url.searchParams.set("autodownload", "1");
              window.location.href = url.toString();
              return;
            } catch (_) {}
          }

          localStorage.removeItem("p2i_downloads");
          localStorage.removeItem("p2i_downloads__guest");

          window.location.href = "dashboard.html";
        }, 800);

      } else {
        if (password.length < 6) {
          throw new Error("Min 6 caractères.");
        }

        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: {
            data: {
              role: currentRole,
              first_name: firstName,
              last_name: lastName
            }
          }
        });

        if (error) throw error;

        saveUserProfileLocally({
          id: data?.user?.id || '',
          email,
          first_name: firstName,
          last_name: lastName,
          role: currentRole,
          created_at: new Date().toISOString()
        });

        localStorage.setItem("p2i_user_email", email);
        localStorage.setItem("p2i_active_user", email);

        showMessage('successDisplay', "Compte créé ! Vérifiez vos emails.");
      }

    } catch (err) {
      const msg = String(err?.message || err || "Erreur inconnue");
      showMessage('errorDisplay', msg);
    } finally {
      btn.disabled = false;
      spinner.style.display = 'none';
    }
  });
</script>
</body>
</html>
