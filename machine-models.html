<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2I - Modèles de machines industrielles</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
      color: white;
      min-height: 100vh;
      padding: 100px 20px 40px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header navigation */
    .nav-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(13, 27, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid rgba(76, 201, 240, 0.2);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      background: linear-gradient(135deg, #4cc9f0, #f72585);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .cart-icon {
      position: relative;
      cursor: pointer;
      font-size: 1.5rem;
      color: #4cc9f0;
      transition: all 0.3s;
    }
    .cart-icon:hover { transform: scale(1.1); }
    .cart-count {
      position: absolute;
      top: -10px;
      right: -10px;
      background: #f72585;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Info machine */
    .machine-info {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 30px;
      border: 1px solid rgba(76, 201, 240, 0.2);
    }
    .machine-info h2 { color: #4cc9f0; margin-bottom: 10px; }
    .machine-badge {
      display: inline-block;
      background: rgba(76, 201, 240, 0.2);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-right: 10px;
    }
    .specs-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin: 5px 5px 0 0;
    }

    /* Grille des modèles */
    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }
    .model-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    .model-card:hover {
      transform: translateY(-8px);
      border-color: #4cc9f0;
      box-shadow: 0 20px 30px rgba(76, 201, 240, 0.2);
    }
    .model-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #4cc9f0, #f72585);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: bold;
      z-index: 2;
      white-space: nowrap;
    }
    .model-content { 
      padding: 20px;
      overflow: hidden;
    }
    .model-name { 
      font-size: clamp(0.95rem, 4vw, 1.2rem);
      margin-bottom: 10px;
      margin-right: 85px;
      color: #4cc9f0;
      font-weight: bold;
      line-height: 1.3;
      word-break: break-word;
      min-height: 50px;
    }
    .model-price {
      font-size: 1.5rem;
      font-weight: bold;
      color: #22c55e;
      margin-bottom: 10px;
    }
    .model-price small { font-size: 0.8rem; color: #94a3b8; }
    
    .rating {
      color: #fbbf24;
      margin-bottom: 10px;
    }
    .supplier-info {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 0.85rem;
    }
    .supplier-status {
      color: #22c55e;
      font-weight: bold;
    }
    .specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 15px 0;
      font-size: 0.8rem;
    }
    .spec-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 8px;
      border-radius: 8px;
    }
    .spec-item span { color: #94a3b8; }
    .delivery-info {
      font-size: 0.8rem;
      color: #4cc9f0;
      margin: 10px 0;
    }
    .warranty-badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      margin-right: 5px;
    }
    .after-sales {
      font-size: 0.75rem;
      color: #94a3b8;
      margin: 8px 0;
    }

    /* ===== ORIGINES DES MODÈLES ===== */
    .model-origins {
      margin: 15px 0 10px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .origins-label {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 10px;
      font-weight: 600;
      text-align: center;
    }
    .origin-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .origin-option {
      flex: 1;
      min-width: 90px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
    }
    .origin-option:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }
    .origin-option.korean {
      border-color: rgba(76, 201, 240, 0.25);
    }
    .origin-option.korean:hover,
    .origin-option.korean.selected {
      border-color: #4cc9f0;
      background: rgba(76, 201, 240, 0.10);
      box-shadow: 0 0 15px rgba(76, 201, 240, 0.1);
    }
    .origin-option.chinese {
      border-color: rgba(255, 193, 7, 0.2);
    }
    .origin-option.chinese:hover,
    .origin-option.chinese.selected {
      border-color: #ffc107;
      background: rgba(255, 193, 7, 0.08);
    }
    .origin-option.europe {
      border-color: rgba(40, 167, 69, 0.2);
    }
    .origin-option.europe:hover,
    .origin-option.europe.selected {
      border-color: #28a745;
      background: rgba(40, 167, 69, 0.08);
    }
    .origin-badge {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .origin-option.korean .origin-badge { color: #4cc9f0; }
    .origin-option.chinese .origin-badge { color: #ffc107; }
    .origin-option.europe .origin-badge { color: #28a745; }
    .origin-price {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: white;
    }
    .origin-features {
      display: block;
      font-size: 0.55rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .model-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .btn-sm {
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
      flex: 1;
      text-align: center;
    }
    .btn-quote {
      background: linear-gradient(135deg, #4cc9f0, #4361ee);
      color: white;
    }
    .btn-quote:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(76, 201, 240, 0.4); }
    .btn-cart {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-cart:hover { background: rgba(76, 201, 240, 0.3); }
    .btn-save {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .btn-save:hover { background: rgba(34, 197, 94, 0.4); }
    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: none;
      transition: all 0.3s;
    }
    .btn-back:hover { background: rgba(76, 201, 240, 0.3); }

    /* Modal panier */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1e293b;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .cart-items { max-height: 300px; overflow-y: auto; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .cart-total {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid rgba(255,255,255,0.2);
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }
    .btn-checkout {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #4cc9f0, #f72585);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }
    .close-modal {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: white;
      padding: 10px 20px;
      border-radius: 50px;
      z-index: 1100;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    @media (max-width: 600px) {
      .models-grid { grid-template-columns: 1fr; }
      .specs-grid { grid-template-columns: 1fr; }
      .model-actions { flex-direction: column; }
      .origin-options { flex-direction: column; }
      .origin-option { min-width: unset; width: 100%; }
    }
    @keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
  </style>
</head>

    let cart = [];
    let compareList = [];

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
    
    function getActiveEmail() { return localStorage.getItem('p2i_user_email') || localStorage.getItem('p2i_active_user') || ''; }
    
    function getUrlParams() {
      const p = new URLSearchParams(window.location.search);
      return { 
        upId: p.get('up_id') || '', 
        upNom: decodeURIComponent(p.get('up_nom') || ''), 
        filiere: decodeURIComponent(p.get('filiere') || ''), 
        machineId: p.get('machine_id') || '', 
        machineName: decodeURIComponent(p.get('machine_name') || ''), 
        machineRole: decodeURIComponent(p.get('machine_role') || ''), 
        machineCapacity: decodeURIComponent(p.get('machine_capacity') || ''), 
        machineUtilities: decodeURIComponent(p.get('machine_utilities') || ''),
        machine_key: p.get('machine_key') || ''
      };
    }

    // ==============================================
    // getMachineRefKey (version complète)
    // ==============================================

    function getMachineRefKey(name) {
      const n = (name || '').toLowerCase(); 
      
      // === ASSEMBLAGE D'ORDINATEURS ===
      if (name === "Poste assemblage") return 'poste_assemblage_pc';
      if (name === "Machine à visser") return 'machine_visser';
      if (name === "Testeur alimentation") return 'testeur_alimentation';
      if (name === "Testeur mémoire RAM") return 'testeur_ram';
      if (name === "Brûleur BIOS") return 'bruleur_bios';
      if (name === "Configuration OS") return 'config_os';
      if (name === "Poste emballage") return 'poste_emballage_pc';
      if (n.includes('poste assemblage')) return 'poste_assemblage_pc';
      if (n.includes('visser')) return 'machine_visser';
      if (n.includes('testeur alimentation')) return 'testeur_alimentation';
      if (n.includes('testeur mémoire') || n.includes('testeur ram')) return 'testeur_ram';
      if (n.includes('bios')) return 'bruleur_bios';
      if (n.includes('configuration') || n.includes('os')) return 'config_os';
      if (n.includes('emballage')) return 'poste_emballage_pc';
      
      // === PRESSE À HUILE ===
      if (name === "Presse à huile") return 'presse_huile';
      if (n === 'presse à huile') return 'presse_huile';
      if (n.includes('presse à huile')) return 'presse_huile';
      
      // === TRANSFORMATION D'ÉPICES ===
      if (name === "Laveuse-décanteuse") return 'laveuse_decanteuse_epices';
      if (name === "Séchoir") return 'sechoir_epices';
      if (name === "Broyeur (moulin à épices)") return 'broyeur_epices';
      if (name === "Tamiseuse vibrante") return 'tamiseuse_epices';
      if (name === "Mélangeuse (spice blender)") return 'melangeuse_epices';
      if (name === "Conditionneuse") return 'conditionneuse_sachets';
      if (name === "Étiqeteuse") return 'etiqueteuse_epices';
      if (name === "Laboratoire qualité (module innovation)") return 'laboratoire_qualite';
      if (name === "Micro-doseuse (module innovation)") return 'micro_doseuse';
      
      // === BOULANGERIE ===
      if (n.includes('pétrin') || n.includes('petrin')) return 'petrin_spiral';
      if (n.includes('diviseuse')) return 'diviseuse_bouleuse';
      if (n.includes('façonneuse') || n.includes('faconneuse')) return 'faconneuse';
      if ((n.includes('chambre') && n.includes('pousse')) || (n.includes('chambre') && n.includes('fermentation'))) return 'chambre_pousse';
      if ((n.includes('four') && n.includes('tunnel')) || (n.includes('four') && n.includes('rotatif'))) return 'four_tunnel';
      if (n.includes('trancheuse')) return 'trancheuse';
      if (n.includes('emballeuse') || n.includes('ensacheuse')) return 'emballeuse';
      
      // === CONSERVERIE ===
      if (n.includes('laveuse') || n.includes('découpeuse') || n.includes('decoupeuse')) return 'laveuse_decoupeuse';
      if (n.includes('blanchisseur') || n.includes('blanchiment')) return 'blanchisseur';
      if (n.includes('remplisseuse') || n.includes('doseuse')) return 'remplisseuse_doseuse';
      if (n.includes('scelleuse') || n.includes('operculieuse')) return 'scelleuse_operculieuse';
      if (n.includes('autoclave') || n.includes('stérilisateur') || n.includes('sterilisateur')) return 'autoclave';
      if (n.includes('étiqueteuse') || n.includes('etiqueteuse')) return 'etiqueteuse';
      if (n.includes('cartonneuse') || (n.includes('conditionnement') && n.includes('secondaire'))) return 'cartonneuse_emballeuse';
      
      // === BISCUITERIE ===
      if (n.includes('mélangeur') || n.includes('melangeur') || (n.includes('pétrin') && n.includes('biscuit'))) return 'melangeur_biscuiterie';
      if (n.includes('lamineuse')) return 'lamineuse_biscuiterie';
      if ((n.includes('façonneuse') || n.includes('faconneuse')) && n.includes('rotative')) return 'faconneuse_rotative';
      if (n.includes('four') && (n.includes('biscuit') || n.includes('biscuiterie'))) return 'four_biscuiterie';
      if (n.includes('refroidisseur')) return 'refroidisseur_biscuiterie';
      if (n.includes('enrobeuse') || n.includes('saupoudreuse')) return 'enrobeuse_saupoudreuse';
      if (n.includes('emballeuse') && n.includes('horizontale')) return 'emballeuse_horizontale';
      
      // === JUS & BOISSONS ===
      if (n.includes('laveuse') || (n.includes('trieuse'))) return 'laveuse_trieuse';
      if (n.includes('éplucheuse') || n.includes('eplucheuse') || n.includes('dénoyauteuse')) return 'eplucheuse_denoyauteuse';
      if (n.includes('broyeur') || n.includes('raspeur')) return 'broyeur_raspeur';
      if (n.includes('filtreuse') || n.includes('tamiseuse')) return 'filtreuse_tamiseuse';
      if ((n.includes('mélangeuse') || n.includes('melangeuse')) || n.includes('doseuse')) return 'melangeuse_doseuse';
      if (n.includes('pasteurisateur')) return 'pasteurisateur';
      if ((n.includes('remplisseuse') || n.includes('scelleuse'))) return 'remplisseuse_scelleuse';
      if (n.includes('concentrateur') || n.includes('évaporateur') || n.includes('evaporateur')) return 'concentrateur_evaporateur';
      
      // === HUILES ===
      if (n.includes('nettoyeur') || n.includes('décortiqueur') || n.includes('decortiqueur')) return 'nettoyeur_decortiqueur';
      if (n.includes('concasseur')) return 'broyeur_concasseur_huile';
      if ((n.includes('broyeur') && n.includes('huile')) || (n.includes('broyeur') && n.includes('graine'))) return 'broyeur_concasseur_huile';
      if (n.includes('cuiseur')) return 'cuiseur_huile';
      if (n.includes('presse') && n.includes('huile') && !n.includes('filtre')) return 'presse_huile';
      if (n.includes('filtre') && n.includes('presse')) return 'filtre_presse_huile';
      if (n.includes('clarificateur') || n.includes('décanteuse') || n.includes('decanteuse')) return 'clarificateur_decanteuse';
      if (n.includes('remplisseuse') && (n.includes('huile') || n.includes('bidon'))) return 'remplisseuse_huile';
      if (n.includes('neutraliseur')) return 'neutraliseur_huile';
      if (n.includes('décoloreur') || n.includes('decoloreur')) return 'decoloreur_huile';
      if (n.includes('désodoriseur') || n.includes('desodoriseur')) return 'desodoriseur_huile';
      if (n.includes('fractionneur')) return 'fractionneur_huile';
      
      // === LAITERIE ===
      if (n.includes('cuve') && n.includes('réception')) return 'cuve_reception';
      if (n.includes('pasteurisateur')) return 'pasteurisateur_lait';
      if (n.includes('écrémeuse') || n.includes('ecremeuse')) return 'ecremeuse';
      if (n.includes('maturation')) return 'cuve_maturation';
      if (n.includes('remplisseuse')) return 'remplisseuse_lait';
      if (n.includes('chambre') && n.includes('froide')) return 'chambre_froide';
      
      // === AUTRES ===
      if (n.includes('granulateur')) return 'granulateur';
      if (n.includes('boulangerie') || n.includes('boulangerie industrielle')) return 'petrin_spiral';
      
      return null;
    }

    // ==============================================
    // displayModels (avec ORIGINES)
    // ==============================================

    function displayModels(params) {
  const grid = document.getElementById('modelsGrid');
  
  let machineKey = null;
  if (params.machine_key && MODELS_DB[params.machine_key]) {
    machineKey = params.machine_key;
  }
  if (!machineKey) {
    machineKey = getMachineRefKey(params.machineName);
  }
  if (!machineKey) {
    for (const key in MODELS_DB) {
      const machine = MODELS_DB[key];
      if (machine.machine_name && params.machineName && 
          machine.machine_name.toLowerCase() === params.machineName.toLowerCase()) {
        machineKey = key;
        break;
      }
    }
  }
  
  if (!machineKey || !MODELS_DB[machineKey]) {
    grid.innerHTML = '<div style="text-align:center;padding:50px;"><i class="fas fa-search" style="font-size:2rem;"></i><p>Aucun modèle disponible pour cette machine.</p><p style="font-size:0.8rem;">Contactez-nous pour un devis personnalisé.</p></div>';
    return;
  }
    
  const machine = MODELS_DB[machineKey];
  const models = machine.models;
  
  // Mettre à jour les infos de la machine
  document.getElementById('machineName').innerHTML = `<i class="fas fa-industry"></i> ${escapeHtml(machine.machine_name || params.machineName)}`;
  document.getElementById('machineRole').innerHTML = `<i class="fas fa-tasks"></i> ${escapeHtml(machine.machine_role || params.machineRole || 'Rôle non spécifié')}`;
  document.getElementById('machineCapacity').innerHTML = `<i class="fas fa-weight-hanging"></i> ${escapeHtml(machine.default_capacity || params.machineCapacity || 'Capacité non spécifiée')}`;
  document.getElementById('machineUtilities').innerHTML = `<i class="fas fa-bolt"></i> ${escapeHtml(machine.default_utilities || params.machineUtilities || 'Utilités non spécifiées')}`;
  
  // Labels et couleurs pour les origines
  const originLabels = {
    chinese: '🇨🇳 Chine - Standard',
    korean: '🇰🇷 Corée du Sud - Premium',
    europe: '🇪🇺 Europe - Neuf / Occasion'
  };
  const originColors = {
    chinese: '#ffc107',
    korean: '#4cc9f0',
    europe: '#28a745'
  };
  const originShort = {
    chinese: 'CN',
    korean: 'KR',
    europe: 'EU'
  };
  
  // Grouper les modèles par origine
  const groupedModels = {};
  models.forEach(m => {
    const origin = m.origin || 'chinese';
    if (!groupedModels[origin]) groupedModels[origin] = [];
    groupedModels[origin].push(m);
  });
  
  // Ordre d'affichage : Chine, Corée, Europe
  const order = ['chinese', 'korean', 'europe'];
  
  let html = '';
  
  order.forEach(origin => {
    if (!groupedModels[origin] || groupedModels[origin].length === 0) return;
    
    html += `
      <div class="origin-section" style="margin-bottom: 30px;">
        <div class="origin-header" style="
          background: ${originColors[origin]}20;
          border-left: 4px solid ${originColors[origin]};
          padding: 10px 20px;
          border-radius: 8px;
          margin-bottom: 15px;
        ">
          <h3 style="color: ${originColors[origin]}; margin: 0;">
            ${originLabels[origin]}
            <span style="font-size: 0.8rem; color: #94a3b8; font-weight: normal; margin-left: 10px;">
              ${groupedModels[origin].length} modèle(s)
            </span>
          </h3>
        </div>
        <div class="models-row" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px;">
    `;
    
    groupedModels[origin].forEach(m => {
      const fullStars = Math.floor(m.rating);
      const hasHalfStar = m.rating % 1 >= 0.5;
      let ratingStars = '';
      for (let i = 0; i < fullStars; i++) ratingStars += '<i class="fas fa-star" style="color:#fbbf24"></i>';
      if (hasHalfStar) ratingStars += '<i class="fas fa-star-half-alt" style="color:#fbbf24"></i>';

            <i class="fas fa-tools"></i> Pièces : ${escapeHtml(m.parts_available)}
          </div>
          <div style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;">
            <button class="btn-sm btn-quote" onclick="requestQuoteWithOrigin('${params.upId}', '${escapeHtml(params.upNom)}', '${escapeHtml(machine.machine_name || params.machineName)}', '${escapeHtml(m.name)}', this)" style="flex:1; padding: 8px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 600; cursor: pointer; border: none; background: linear-gradient(135deg, #4cc9f0, #4361ee); color: white;">
              <i class="fas fa-file-invoice"></i> Devis
            </button>
            <button class="btn-sm btn-cart" onclick="addToCartWithOrigin('${escapeHtml(m.name)}', this)" style="flex:1; padding: 8px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 600; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1); color: white;">
              <i class="fas fa-cart-plus"></i> Panier
            </button>
            <button class="btn-sm btn-save" onclick="saveToDashboardWithOrigin('${params.upId}', '${escapeHtml(params.upNom)}', '${escapeHtml(machine.machine_name || params.machineName)}', '${escapeHtml(m.name)}', '${escapeHtml(machine.machine_role || params.machineRole)}', '${escapeHtml(machine.default_capacity || params.machineCapacity)}', '${escapeHtml(machine.default_utilities || params.machineUtilities)}', this)" style="flex:1; padding: 8px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 600; cursor: pointer; border: 1px solid rgba(34,197,94,0.3); background: rgba(34,197,94,0.2); color: #22c55e;">
              <i class="fas fa-save"></i> Enregistrer
            </button>
            <button class="btn-sm btn-supplier" 
                    onclick="contactSupplier('${m.origin}', '${escapeHtml(m.supplier)}', '${escapeHtml(m.name)}', '${escapeHtml(m.id)}', '${m.price_ttc}', '${escapeHtml(m.specs.capacity)}')" 
                    style="flex:1; padding: 8px 12px; border-radius: 8px; font-size: 0.7rem; font-weight: 600; cursor: pointer; border: 1px solid rgba(76,201,240,0.3); background: rgba(76,201,240,0.1); color: #4cc9f0;">
              <i class="fas fa-building"></i> Fournisseur
            </button>
          </div>
        </div>
      `;
    });
    
    html += `
        </div>
      </div>
    `;
  });
  
  if (html === '') {
    grid.innerHTML = '<div style="text-align:center;padding:50px;"><i class="fas fa-search" style="font-size:2rem;"></i><p>Aucun modèle disponible pour cette machine.</p></div>';
  } else {
    grid.innerHTML = html;
  }
}
// ==============================================
// CONTACT FOURNISSEUR - VERSION PARTENARIAT
// ==============================================

    // ==============================================
    // GESTION DES ORIGINES
    // ==============================================

    let selectedOrigins = {}; // { modelId: { origin, price } }

    function selectModelOrigin(element, modelId, origin, price) {
      const parent = element.closest('.origin-options');
      parent.querySelectorAll('.origin-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      
      element.classList.add('selected');
      selectedOrigins[modelId] = { origin, price };
      
      const card = element.closest('.model-card');
      const actions = card.querySelectorAll('.model-actions button');
      const labels = { korean: '🇰🇷 Corée', chinese: '🇨🇳 Chine', europe: '🇪🇺 Europe' };
      
      actions.forEach(btn => {
        const action = btn.textContent.trim();
        if (action.includes('Devis')) {
          btn.innerHTML = `<i class="fas fa-file-invoice"></i> Devis (${labels[origin]})`;
        } else if (action.includes('Panier')) {
          btn.innerHTML = `<i class="fas fa-cart-plus"></i> Panier (${labels[origin]})`;
        } else if (action.includes('Enregistrer')) {
          btn.innerHTML = `<i class="fas fa-save"></i> Enregistrer (${labels[origin]})`;
        }
        btn.dataset.origin = origin;
        btn.dataset.price = price;
      });
    }

    function getSelectedOrigin(element) {
      const card = element.closest('.model-card');
      const modelId = card?.querySelector('.origin-options')?.dataset.model;
      if (modelId && selectedOrigins[modelId]) {
        return selectedOrigins[modelId];
      }
      return { origin: 'chinese', price: null };
    }

    // ==============================================
    // FONCTIONS AVEC ORIGINE
    // ==============================================

    function requestQuoteWithOrigin(upId, upNom, machineName, modelName, btn) {
      const selection = getSelectedOrigin(btn);
      const price = selection.price || 'Prix sur demande';
      const origin = selection.origin || 'chinese';
      
      const email = getActiveEmail();
      if (!email) {
        alert('Veuillez vous connecter pour générer un devis officiel.');
        window.location.href = 'login.html?mode=login&redirect=' + encodeURIComponent(window.location.href);
        return;
      }
      
      const devisKey = `p2i_quotes_${email}`;
      let quotes = JSON.parse(localStorage.getItem(devisKey) || '[]');
      
      const labels = { korean: '🇰🇷 Premium Corée du Sud', chinese: '🇨🇳 Standard Chine', europe: '🇪🇺 Occasion Europe' };
      
      const newQuote = {
        id: Date.now() + '_' + Math.random().toString(36).substr(2, 8),
        machine: machineName,
        model: modelName,
        origin: origin,
        origin_label: labels[origin] || origin,
        up_nom: upNom,
        up_id: upId,
        price: price,
        date: new Date().toISOString(),
        status: "pending"
      };
      
      quotes.push(newQuote);
      localStorage.setItem(devisKey, JSON.stringify(quotes));
      
      console.log("✅ Devis sauvegardé avec origine :", newQuote);
      
      const url = `devis-detail.html?id=${newQuote.id}&up_id=${upId}&up_nom=${encodeURIComponent(upNom)}&machine_name=${encodeURIComponent(machineName)}&model_name=${encodeURIComponent(modelName)}&price=${price}&origin=${origin}`;
      window.location.href = url;
    }

    function addToCartWithOrigin(modelName, btn) {
      const selection = getSelectedOrigin(btn);
      const price = selection.price || 'Prix sur demande';
      const origin = selection.origin || 'chinese';
      const labels = { korean: '🇰🇷 Premium Corée', chinese: '🇨🇳 Standard Chine', europe: '🇪🇺 Occasion Europe' };
      
      cart.push({ 
        name: `${modelName} (${labels[origin] || origin})`, 
        price: price, 
        origin: origin,
        date: new Date().toISOString() 
      }); 
      saveCart(); 
      showToast(`✓ "${modelName}" (${labels[origin]}) ajouté au panier`); 
      renderCartModal();
    }

    function saveToDashboardWithOrigin(upId, upNom, machineName, modelName, machineRole, machineCapacity, machineUtilities, btn) {
      const email = getActiveEmail();
      if (!email) { alert('Veuillez vous connecter.'); window.location.href = 'login.html?mode=login'; return; }
      
      const selection = getSelectedOrigin(btn);
      const price = selection.price || 'Prix sur demande';
      const origin = selection.origin || 'chinese';
      const labels = { korean: '🇰🇷 Premium Corée', chinese: '🇨🇳 Standard Chine', europe: '🇪🇺 Occasion Europe' };
      
      const savedKey = `p2i_saved_machines__${email}`;
      let saved = JSON.parse(localStorage.getItem(savedKey) || '[]');
      
      const entry = { 
        up_id: upId, 
        up_nom: upNom, 
        machine: machineName, 
        model: modelName,
        origin: origin,
        origin_label: labels[origin] || origin,
        price: price,
        machine_role: machineRole,
        machine_capacity: machineCapacity,
        machine_utilities: machineUtilities,
        saved_at: new Date().toISOString() 
      };
      
      if (!saved.some(m => m.model === modelName && m.up_id === upId)) {
        saved.push(entry);
        localStorage.setItem(savedKey, JSON.stringify(saved));
        showToast(`✅ "${modelName}" (${labels[origin]}) enregistré dans le Dashboard`);
      } else {
        const idx = saved.findIndex(m => m.model === modelName && m.up_id === upId);
        if (idx > -1) {
          saved[idx] = { ...saved[idx], origin: origin, origin_label: labels[origin] || origin, price: price };
          localStorage.setItem(savedKey, JSON.stringify(saved));
          showToast(`✅ "${modelName}" mis à jour (${labels[origin]})`);
        } else {
          showToast(`ℹ️ "${modelName}" déjà enregistré`);
        }
      }
    }

    // ==============================================
    // GESTION DU PANIER
    // ==============================================

    function loadCart() { const saved = localStorage.getItem('p2i_machines_cart'); if (saved) try { cart = JSON.parse(saved); } catch(e) { cart = []; } updateCartBadge(); }
    function saveCart() { localStorage.setItem('p2i_machines_cart', JSON.stringify(cart)); updateCartBadge(); }
    function updateCartBadge() { document.getElementById('cartCount').textContent = cart.length; }
    function removeFromCart(index) { cart.splice(index, 1); saveCart(); renderCartModal(); showToast("Article retiré du panier"); }
    
    function renderCartModal() {
      const container = document.getElementById('cartItemsList');
      const totalSpan = document.getElementById('cartTotalDisplay');
      if (!container) return;
      if (cart.length === 0) { container.innerHTML = '<div class="empty-cart">Aucun article</div>'; totalSpan.innerHTML = '<span>Total TTC</span><span>0 $</span>'; return; }
      let total = 0;
      container.innerHTML = cart.map((item, idx) => { 
        total += typeof item.price === 'number' ? item.price : 0; 
        return `<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${escapeHtml(item.name)}</div><div class="cart-item-price">${typeof item.price === 'number' ? item.price.toLocaleString() : item.price} $</div></div><button class="cart-item-remove" onclick="removeFromCart(${idx})"><i class="fas fa-trash"></i></button></div>`; 
      }).join('');
      totalSpan.innerHTML = `<span>Total TTC</span><span>${total.toLocaleString()} $</span>`;
    }
    
    function openCartModal() { document.getElementById('cartModal').style.display = 'flex'; renderCartModal(); }
    function closeCartModal() { document.getElementById('cartModal').style.display = 'none'; }
    
    function checkoutCart() {
      if (cart.length === 0) { alert('Votre panier est vide.'); return; }
      const useAlibaba = confirm(`🛒 ${cart.length} article(s) dans votre panier.\n\n• OK → Alibaba (Trade Assurance)\n• Annuler → Made-in-China (Secure Payment)`);
      const searchTerms = cart.map(item => encodeURIComponent(item.name)).join('+');
      const url = useAlibaba ? `https://www.alibaba.com/trade/search?SearchText=${searchTerms}` : `https://fr.made-in-china.com/recherche/recherche.do?word=${searchTerms}`;
      window.open(url, '_blank');
      
      const email = getActiveEmail();
      if (email) {
        const order = { id: 'order_' + Date.now(), date: new Date().toISOString(), items: [...cart], platform: useAlibaba ? 'Alibaba' : 'Made-in-China' };
        let orders = JSON.parse(localStorage.getItem(`p2i_orders_${email}`) || '[]');
        orders.push(order);
        localStorage.setItem(`p2i_orders_${email}`, JSON.stringify(orders));
      }
      
      cart = [];
      saveCart();
      closeCartModal();
      showToast("Redirection vers la plateforme de vente");
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      setTimeout(() => t.style.opacity = '0', 3000);
    }

    // ==============================================
    // RETOUR
    // ==============================================

    function goBack() {
      const urlParams = new URLSearchParams(window.location.search);
      const upId = urlParams.get('up_id');
      const upNom = urlParams.get('up_nom');
      
      if (upId && upNom) {
        const timestamp = Date.now();
        window.location.replace(`service-achat-machines.html?up_id=${upId}&up_nom=${encodeURIComponent(upNom)}&_t=${timestamp}`);
      } else {
        window.location.replace('service-achat-machines.html');
      }
    }

    // ==============================================
    // INITIALISATION
    // ==============================================

    function init() {
      const params = getUrlParams();
      displayMachineInfo(params);
      displayModels(params);
      loadCart();
      
      window.addToCart = addToCartWithOrigin;
      window.removeFromCart = removeFromCart;
      window.saveToDashboard = saveToDashboardWithOrigin;
      window.checkoutCart = checkoutCart;
      window.goBack = goBack;
      window.openCartModal = openCartModal;
      window.closeCartModal = closeCartModal;
      window.requestQuoteWithOrigin = requestQuoteWithOrigin;
      window.selectModelOrigin = selectModelOrigin;
      window.getSelectedOrigin = getSelectedOrigin;
    }
    
    // Lancer l'initialisation
    document.addEventListener('DOMContentLoaded', init);
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      init();
    }
  </script>
