<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2I - Modèles de machines industrielles</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
      color: white;
      min-height: 100vh;
      padding: 100px 20px 40px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header navigation */
    .nav-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(13, 27, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid rgba(76, 201, 240, 0.2);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      background: linear-gradient(135deg, #4cc9f0, #f72585);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .cart-icon {
      position: relative;
      cursor: pointer;
      font-size: 1.5rem;
      color: #4cc9f0;
      transition: all 0.3s;
    }
    .cart-icon:hover { transform: scale(1.1); }
    .cart-count {
      position: absolute;
      top: -10px;
      right: -10px;
      background: #f72585;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Info machine */
    .machine-info {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 30px;
      border: 1px solid rgba(76, 201, 240, 0.2);
    }
    .machine-info h2 { color: #4cc9f0; margin-bottom: 10px; }
    .machine-badge {
      display: inline-block;
      background: rgba(76, 201, 240, 0.2);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-right: 10px;
    }
    .specs-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin: 5px 5px 0 0;
    }

    /* Grille des modèles */
    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }
    .model-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    .model-card:hover {
      transform: translateY(-8px);
      border-color: #4cc9f0;
      box-shadow: 0 20px 30px rgba(76, 201, 240, 0.2);
    }
    .model-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #4cc9f0, #f72585);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: bold;
      z-index: 2;
      white-space: nowrap;
    }
    .model-content { 
      padding: 20px;
      overflow: hidden;
    }
    .model-name { 
      font-size: clamp(0.95rem, 4vw, 1.2rem);
      margin-bottom: 10px;
      margin-right: 85px;
      color: #4cc9f0;
      font-weight: bold;
      line-height: 1.3;
      word-break: break-word;
      min-height: 50px;
    }
    .model-price {
      font-size: 1.5rem;
      font-weight: bold;
      color: #22c55e;
      margin-bottom: 10px;
    }
    .model-price small { font-size: 0.8rem; color: #94a3b8; }
    
    .rating {
      color: #fbbf24;
      margin-bottom: 10px;
    }
    .supplier-info {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 0.85rem;
    }
    .supplier-status {
      color: #22c55e;
      font-weight: bold;
    }
    .specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 15px 0;
      font-size: 0.8rem;
    }
    .spec-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 8px;
      border-radius: 8px;
    }
    .spec-item span { color: #94a3b8; }
    .delivery-info {
      font-size: 0.8rem;
      color: #4cc9f0;
      margin: 10px 0;
    }
    .warranty-badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      margin-right: 5px;
    }
    .after-sales {
      font-size: 0.75rem;
      color: #94a3b8;
      margin: 8px 0;
    }

    /* ===== ORIGINES DES MODÈLES ===== */
    .model-origins {
      margin: 15px 0 10px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .origins-label {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 10px;
      font-weight: 600;
      text-align: center;
    }
    .origin-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .origin-option {
      flex: 1;
      min-width: 90px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
    }
    .origin-option:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }
    .origin-option.korean {
      border-color: rgba(76, 201, 240, 0.25);
    }
    .origin-option.korean:hover,
    .origin-option.korean.selected {
      border-color: #4cc9f0;
      background: rgba(76, 201, 240, 0.10);
      box-shadow: 0 0 15px rgba(76, 201, 240, 0.1);
    }
    .origin-option.chinese {
      border-color: rgba(255, 193, 7, 0.2);
    }
    .origin-option.chinese:hover,
    .origin-option.chinese.selected {
      border-color: #ffc107;
      background: rgba(255, 193, 7, 0.08);
    }
    .origin-option.europe {
      border-color: rgba(40, 167, 69, 0.2);
    }
    .origin-option.europe:hover,
    .origin-option.europe.selected {
      border-color: #28a745;
      background: rgba(40, 167, 69, 0.08);
    }
    .origin-badge {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .origin-option.korean .origin-badge { color: #4cc9f0; }
    .origin-option.chinese .origin-badge { color: #ffc107; }
    .origin-option.europe .origin-badge { color: #28a745; }
    .origin-price {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: white;
    }
    .origin-features {
      display: block;
      font-size: 0.55rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .model-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .btn-sm {
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
      flex: 1;
      text-align: center;
    }
    .btn-quote {
      background: linear-gradient(135deg, #4cc9f0, #4361ee);
      color: white;
    }
    .btn-quote:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(76, 201, 240, 0.4); }
    .btn-cart {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-cart:hover { background: rgba(76, 201, 240, 0.3); }
    .btn-save {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .btn-save:hover { background: rgba(34, 197, 94, 0.4); }
    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: none;
      transition: all 0.3s;
    }
    .btn-back:hover { background: rgba(76, 201, 240, 0.3); }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1e293b;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .cart-items { max-height: 300px; overflow-y: auto; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .cart-total {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid rgba(255,255,255,0.2);
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }
    .btn-checkout {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #4cc9f0, #f72585);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }
    .close-modal {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: white;
      padding: 10px 20px;
      border-radius: 50px;
      z-index: 1100;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    @media (max-width: 600px) {
      .models-grid { grid-template-columns: 1fr; }
      .specs-grid { grid-template-columns: 1fr; }
      .model-actions { flex-direction: column; }
      .origin-options { flex-direction: column; }
      .origin-option { min-width: unset; width: 100%; }
    }
    @keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}

    function getMachineRefKey(name) {

  // ===== SMARTPHONES & TABLETTES (recherche partielle) =====

async function demanderMiseEnRelation(productName, supplier, origin, modelId) {
  const email = getActiveEmail();
  if (!email) {
    alert('Veuillez vous connecter pour demander une mise en relation.');
    window.location.href = 'login.html?mode=login';
    return;
  }

  try {
    // 1. Récupérer l'utilisateur connecté via Supabase
    const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
    if (userError || !user) {
      alert('Erreur de connexion. Veuillez vous reconnecter.');
      window.location.href = 'login.html?mode=login';
      return;
    }

    // 2. Insérer la demande dans la table "user_contacts"
    const { data, error } = await supabaseClient
      .from('user_contacts')
      .insert({
        user_id: user.id,
        product_name: productName,
        supplier_name: supplier,
        origin: origin,
        model_id: modelId || 'Non spécifié',
        status: 'pending'
      })
      .select();

    if (error) {
      console.error('❌ Erreur Supabase:', error);
      alert('Erreur lors de l\'enregistrement de la demande.');
      return;
    }

    // 3. Succès
    const modal = document.getElementById('p2i-supplier-modal');
    if (modal) modal.remove();

   showToast(`✅ Demande de mise en relation avec ${supplier} enregistrée !`);

setTimeout(() => {
  window.location.href = 'dashboard.html#mes-mises-en-relation';
}, 1500);
  } catch(e) {
    console.error('❌ Erreur inattendue:', e);
    alert('Une erreur est survenue.');
  }
}

// ==============================================
// SAUVEGARDER UNE MACHINE POUR PLUS TARD
// ==============================================

function sauvegarderMachinePourPlusTard(productName, supplier, origin) {
  const email = getActiveEmail();
  if (!email) {
    alert('Veuillez vous connecter pour sauvegarder cette machine.');
    window.location.href = 'login.html?mode=login';
    return;
  }
  
  const savedKey = `p2i_saved_machines_${email}`;
  let saved = JSON.parse(localStorage.getItem(savedKey) || '[]');
  
  if (saved.some(item => item.product === productName && item.supplier === supplier)) {
    showToast(`ℹ️ "${productName}" est déjà dans vos favoris.`);
    return;
  }
  
  saved.push({
    id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
    product: productName,
    supplier: supplier,
    origin: origin,
    date: new Date().toISOString()
  });
  
  localStorage.setItem(savedKey, JSON.stringify(saved));
  
  const modal = document.getElementById('p2i-supplier-modal');
  if (modal) modal.remove();
  
  showToast(`✅ "${productName}" sauvegardé dans vos favoris !`);
}

function showToast(message) {
  const existing = document.getElementById('p2i-toast');
  if (existing) existing.remove();
  
  const toast = document.createElement('div');
  toast.id = 'p2i-toast';
  toast.style.cssText = `
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: #1c2541; color: white; padding: 14px 28px;
    border-radius: 14px; font-weight: 600; z-index: 1100;
    border: 1px solid rgba(76, 201, 240, 0.3);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    animation: fadeInUp 0.3s ease;
    max-width: 90vw;
    text-align: center;
    font-size: 0.9rem;
  `;
  toast.textContent = message;
  document.body.appendChild(toast);
  
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

    let selectedOrigins = {}; // { modelId: { origin, price } }

    function selectModelOrigin(element, modelId, origin, price) {
      const parent = element.closest('.origin-options');
      parent.querySelectorAll('.origin-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      
      element.classList.add('selected');
      selectedOrigins[modelId] = { origin, price };
      
      const card = element.closest('.model-card');
      const actions = card.querySelectorAll('.model-actions button');
      const labels = { korean: '🇰🇷 Corée', chinese: '🇨🇳 Chine', europe: '🇪🇺 Europe' };
      
      actions.forEach(btn => {
        const action = btn.textContent.trim();
        if (action.includes('Devis')) {
          btn.innerHTML = `<i class="fas fa-file-invoice"></i> Devis (${labels[origin]})`;
        } else if (action.includes('Panier')) {
          btn.innerHTML = `<i class="fas fa-cart-plus"></i> Panier (${labels[origin]})`;
        } else if (action.includes('Enregistrer')) {
          btn.innerHTML = `<i class="fas fa-save"></i> Enregistrer (${labels[origin]})`;
        }
        btn.dataset.origin = origin;
        btn.dataset.price = price;
      });
    }

      const card = element.closest('.model-card');
      const modelId = card?.querySelector('.origin-options')?.dataset.model;
      if (modelId && selectedOrigins[modelId]) {
        return selectedOrigins[modelId];
      }
      return { origin: 'chinese', price: null };
    }

      '🔍 5. Tentative de sauvegarde dans saved_machines...'
    );

    const {
      data: insertData,
      error
    } = await supabaseClient
      .from('saved_machines')
      .insert({
        user_id: user.id,
        data: machineData
      })
      .select();


    // ==============================================
    // 5. GESTION D'ERREUR
    // ==============================================

    if (error) {

      console.error(
        '❌ 6. Erreur sauvegarde Supabase:',
        error
      );

      console.error(
        '❌ Détails:',
        JSON.stringify(error, null, 2)
      );

      alert(
        '❌ Erreur lors de l\'enregistrement: ' +
        error.message
      );

      return;
    }


    // ==============================================
    // 6. SUCCÈS
    // ==============================================

    console.log(
      '✅ 7. Machine sauvegardée avec succès:',
      insertData
    );

    console.log(
      '📦 Données enregistrées dans saved_machines:',
      machineData
    );


    showToast(
      `✅ "${modelName}" (${labels[origin] || origin}) enregistré dans le Dashboard`
    );


    // ==============================================
    // 7. RETOUR VERS MES MACHINES
    // ==============================================

    setTimeout(() => {
      window.location.href =
        'dashboard.html#mes-machines';
    }, 1500);

  } catch (e) {

    console.error(
      '❌ Erreur inattendue:',
      e
    );

    alert(
      '❌ Erreur lors de l'enregistrement.'
    );
  }
}

    // ==============================================
    // GESTION DU PANIER
    // ==============================================

    function loadCart() { const saved = localStorage.getItem('p2i_machines_cart'); if (saved) try { cart = JSON.parse(saved); } catch(e) { cart = []; } updateCartBadge(); }
    function saveCart() { localStorage.setItem('p2i_machines_cart', JSON.stringify(cart)); updateCartBadge(); }
    function updateCartBadge() { document.getElementById('cartCount').textContent = cart.length; }
    function removeFromCart(index) { cart.splice(index, 1); saveCart(); renderCartModal(); showToast("Article retiré du panier"); }
    
    function renderCartModal() {
      const container = document.getElementById('cartItemsList');
      const totalSpan = document.getElementById('cartTotalDisplay');
      if (!container) return;
      if (cart.length === 0) { container.innerHTML = '<div class="empty-cart">Aucun article</div>'; totalSpan.innerHTML = '<span>Total TTC</span><span>0 $</span>'; return; }
      let total = 0;
      container.innerHTML = cart.map((item, idx) => { 
        total += typeof item.price === 'number' ? item.price : 0; 
        return `<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${escapeHtml(item.name)}</div><div class="cart-item-price">${typeof item.price === 'number' ? item.price.toLocaleString() : item.price} $</div></div><button class="cart-item-remove" onclick="removeFromCart(${idx})"><i class="fas fa-trash"></i></button></div>`; 
      }).join('');
      totalSpan.innerHTML = `<span>Total TTC</span><span>${total.toLocaleString()} $</span>`;
    }
    
    function openCartModal() { document.getElementById('cartModal').style.display = 'flex'; renderCartModal(); }
    function closeCartModal() { document.getElementById('cartModal').style.display = 'none'; }
    
    function checkoutCart() {
      if (cart.length === 0) { alert('Votre panier est vide.'); return; }
      const useAlibaba = confirm(`🛒 ${cart.length} article(s) dans votre panier.\n\n• OK → Alibaba (Trade Assurance)\n• Annuler → Made-in-China (Secure Payment)`);
      const searchTerms = cart.map(item => encodeURIComponent(item.name)).join('+');
      const url = useAlibaba ? `https://www.alibaba.com/trade/search?SearchText=${searchTerms}` : `https://fr.made-in-china.com/recherche/recherche.do?word=${searchTerms}`;
      window.open(url, '_blank');
      
      const email = getActiveEmail();
      if (email) {
        const order = { id: 'order_' + Date.now(), date: new Date().toISOString(), items: [...cart], platform: useAlibaba ? 'Alibaba' : 'Made-in-China' };
        let orders = JSON.parse(localStorage.getItem(`p2i_orders_${email}`) || '[]');
        orders.push(order);
        localStorage.setItem(`p2i_orders_${email}`, JSON.stringify(orders));
      }
      
      cart = [];
      saveCart();
      closeCartModal();
      showToast("Redirection vers la plateforme de vente");
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      setTimeout(() => t.style.opacity = '0', 3000);
    }

    // ==============================================
    // RETOUR
    // ==============================================

    function goBack() {
      const urlParams = new URLSearchParams(window.location.search);
      const upId = urlParams.get('up_id');
      const upNom = urlParams.get('up_nom');
      
      if (upId && upNom) {
        const timestamp = Date.now();
        window.location.replace(`service-achat-machines.html?up_id=${upId}&up_nom=${encodeURIComponent(upNom)}&_t=${timestamp}`);
      } else {
        window.location.replace('service-achat-machines.html');
      }
    }

    // ==============================================
    // INITIALISATION
    // ==============================================

    function init() {
      const params = getUrlParams();
      displayMachineInfo(params);
      displayModels(params);
      loadCart();
      
      window.addToCart = addToCartWithOrigin;
      window.removeFromCart = removeFromCart;
      window.saveToDashboard = saveToDashboardWithOrigin;
      window.checkoutCart = checkoutCart;
      window.goBack = goBack;
      window.openCartModal = openCartModal;
      window.closeCartModal = closeCartModal;
      window.requestQuoteWithOrigin = requestQuoteWithOrigin;
      window.selectModelOrigin = selectModelOrigin;
      window.getSelectedOrigin = getSelectedOrigin;
    }
    
    // Lancer l'initialisation
    document.addEventListener('DOMContentLoaded', init);
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      init();
    }
  </script>
