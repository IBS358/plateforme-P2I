<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2I - Modèles de machines industrielles</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
      color: white;
      min-height: 100vh;
      padding: 100px 20px 40px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header navigation */
    .nav-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(13, 27, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid rgba(76, 201, 240, 0.2);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      background: linear-gradient(135deg, #4cc9f0, #f72585);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .cart-icon {
      position: relative;
      cursor: pointer;
      font-size: 1.5rem;
      color: #4cc9f0;
      transition: all 0.3s;
    }
    .cart-icon:hover { transform: scale(1.1); }
    .cart-count {
      position: absolute;
      top: -10px;
      right: -10px;
      background: #f72585;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Info machine */
    .machine-info {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 30px;
      border: 1px solid rgba(76, 201, 240, 0.2);
    }
    .machine-info h2 { color: #4cc9f0; margin-bottom: 10px; }
    .machine-badge {
      display: inline-block;
      background: rgba(76, 201, 240, 0.2);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-right: 10px;
    }
    .specs-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin: 5px 5px 0 0;
    }

    /* Grille des modèles */
    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }
    .model-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    .model-card:hover {
      transform: translateY(-8px);
      border-color: #4cc9f0;
      box-shadow: 0 20px 30px rgba(76, 201, 240, 0.2);
    }
    .model-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: linear-gradient(135deg, #4cc9f0, #f72585);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: bold;
      z-index: 2;
    }
    .model-content { padding: 20px; }
    .model-name { 
      font-size: 1.3rem; 
      margin-bottom: 10px; 
      color: #4cc9f0;
      font-weight: bold;
    }
    .model-price {
      font-size: 1.5rem;
      font-weight: bold;
      color: #22c55e;
      margin-bottom: 10px;
    }
    .model-price small { font-size: 0.8rem; color: #94a3b8; }
    
    .rating {
      color: #fbbf24;
      margin-bottom: 10px;
    }
    .supplier-info {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 0.85rem;
    }
    .supplier-status {
      color: #22c55e;
      font-weight: bold;
    }
    .specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 15px 0;
      font-size: 0.8rem;
    }
    .spec-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 8px;
      border-radius: 8px;
    }
    .spec-item span { color: #94a3b8; }
    .delivery-info {
      font-size: 0.8rem;
      color: #4cc9f0;
      margin: 10px 0;
    }
    .warranty-badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      margin-right: 5px;
    }
    .after-sales {
      font-size: 0.75rem;
      color: #94a3b8;
      margin: 8px 0;
    }
    .model-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .btn-sm {
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
      flex: 1;
      text-align: center;
    }
    .btn-quote {
      background: linear-gradient(135deg, #4cc9f0, #4361ee);
      color: white;
    }
    .btn-quote:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(76, 201, 240, 0.4); }
    .btn-cart {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-cart:hover { background: rgba(76, 201, 240, 0.3); }
    .btn-save {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .btn-save:hover { background: rgba(34, 197, 94, 0.4); }
    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: none;
      transition: all 0.3s;
    }
    .btn-back:hover { background: rgba(76, 201, 240, 0.3); }

    /* Modal panier */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1e293b;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .cart-items { max-height: 300px; overflow-y: auto; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .cart-total {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid rgba(255,255,255,0.2);
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }
    .btn-checkout {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #4cc9f0, #f72585);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }
    .close-modal {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: white;
      padding: 10px 20px;
      border-radius: 50px;
      z-index: 1100;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    @media (max-width: 768px) {
      .models-grid { grid-template-columns: 1fr; }
      .specs-grid { grid-template-columns: 1fr; }
      .model-actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="nav-header">
    <div class="logo">🏭 P2I - Modèles Industriels</div>
    <div class="cart-icon" onclick="openCartModal()">
      <i class="fas fa-shopping-cart"></i>
      <span class="cart-count" id="cartCount">0</span>
    </div>
  </div>

  <div class="container">
    <button class="btn-back" onclick="goBack()">
      <i class="fas fa-arrow-left"></i> Retour
    </button>

    <div class="machine-info" id="machineInfo">
      <h2 id="machineName">Machine</h2>
      <div><span class="machine-badge" id="upName"></span> <span class="machine-badge" id="upFiliere"></span></div>
      <div style="margin-top: 15px;">
        <span class="specs-tag" id="machineRole"></span>
        <span class="specs-tag" id="machineCapacity"></span>
        <span class="specs-tag" id="machineUtilities"></span>
      </div>
    </div>

    <div class="models-grid" id="modelsGrid"></div>
  </div>

  <!-- Modal panier -->
  <div id="cartModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><i class="fas fa-shopping-cart"></i> Mon panier</h3>
        <button class="close-modal" onclick="closeCartModal()">&times;</button>
      </div>
      <div class="cart-items" id="cartItemsList"></div>
      <div class="cart-total" id="cartTotalDisplay"></div>
      <button class="btn-checkout" onclick="checkoutCart()">
        <i class="fab fa-alipay"></i> Voir sur Alibaba / Made-in-China
      </button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // ==============================================
    // BASE DE DONNÉES COMPLÈTE DES MODÈLES
    // ==============================================

    const MODELS_DB = {
      "boulangerie_industrielle": {
        machine_ref: "boulangerie_industrielle",
        models: [
          { 
            id: "petrin_econo", name: "Pétrin spiral - Économique", price_ttc: 8900, 
            brand: "Jinfeng Machinery", supplier: "Henan Jinfeng Machinery Co., Ltd", 
            supplier_status: "Gold Supplier (5 ans)", rating: 4.2, review_count: 156,
            specs: { power: "7.5 kW", capacity: "120 kg/batch", dimensions: "1500x900x1200 mm", weight: "650 kg", material: "Acier traité" },
            delivery: "45-60 jours", warranty: "12 mois", parts_available: "Stock Chine", after_sales: "Support WhatsApp + documentation"
          },
          { 
            id: "petrin_std", name: "Pétrin spiral - Standard", price_ttc: 14500, 
            brand: "Jinfeng Machinery", supplier: "Henan Jinfeng Machinery Co., Ltd", 
            supplier_status: "Gold Supplier (8 ans)", rating: 4.6, review_count: 328,
            specs: { power: "11 kW", capacity: "200 kg/batch", dimensions: "1800x1100x1400 mm", weight: "950 kg", material: "Acier inoxydable 304" },
            delivery: "45-60 jours", warranty: "12 mois", parts_available: "Stock Abidjan + Chine", after_sales: "Formation + visio + pièces 48h"
          },
          { 
            id: "petrin_premium", name: "Pétrin spiral - Premium", price_ttc: 22500, 
            brand: "Jinfeng Machinery", supplier: "Henan Jinfeng Machinery Co., Ltd", 
            supplier_status: "Gold Supplier (8 ans)", rating: 4.9, review_count: 89,
            specs: { power: "15 kW", capacity: "300 kg/batch", dimensions: "2000x1250x1550 mm", weight: "1250 kg", material: "Acier inoxydable 316L" },
            delivery: "30-45 jours", warranty: "24 mois", parts_available: "Dépôt France + Chine", after_sales: "Présence technique locale + hotline"
          }
        ]
      },
      "diviseuse_bouleuse": {
        machine_ref: "diviseuse_bouleuse",
        models: [
          { id: "diviseuse_std", name: "Diviseuse-bouleuse - Standard", price_ttc: 12800, brand: "Sainty Machinery", supplier: "Sainty Co., Ltd", supplier_status: "Verified Supplier (6 ans)", rating: 4.3, review_count: 187, specs: { power: "3 kW", capacity: "1200 pains/h", dimensions: "1500x800x1200 mm", weight: "580 kg", material: "Acier" }, delivery: "45 jours", warranty: "12 mois", parts_available: "Stock Chine", after_sales: "Support technique 24/7" },
          { id: "diviseuse_premium", name: "Diviseuse-bouleuse - Premium", price_ttc: 19500, brand: "Sainty Machinery", supplier: "Sainty Co., Ltd", supplier_status: "Verified Supplier (6 ans)", rating: 4.7, review_count: 112, specs: { power: "5.5 kW", capacity: "2000 pains/h", dimensions: "1800x900x1350 mm", weight: "820 kg", material: "Acier inoxydable" }, delivery: "60 jours", warranty: "24 mois", parts_available: "Stock Abidjan", after_sales: "Technicien sur site sous 7 jours" }
        ]
      },
      "four_tunnel": {
        machine_ref: "four_tunnel",
        models: [
          { id: "four_tunnel_std", name: "Four tunnel - Standard", price_ttc: 24800, brand: "Doyon Bakery", supplier: "Doyon Équipements", supplier_status: "Premium Partner", rating: 4.5, review_count: 89, specs: { power: "35 kW", capacity: "300 pains/batch", dimensions: "2500x1800x1800 mm", weight: "1800 kg", material: "Acier inoxydable" }, delivery: "60-75 jours", warranty: "24 mois", parts_available: "Stock France", after_sales: "SAV France + envoi pièces 48h" },
          { id: "four_tunnel_premium", name: "Four tunnel - Premium", price_ttc: 37500, brand: "Doyon Bakery", supplier: "Doyon Équipements", supplier_status: "Premium Partner", rating: 4.9, review_count: 45, specs: { power: "55 kW", capacity: "500 pains/batch", dimensions: "3000x2000x2000 mm", weight: "2500 kg", material: "Acier inoxydable 316L" }, delivery: "45-60 jours", warranty: "36 mois", parts_available: "Stock France + expédition rapide", after_sales: "Contrat maintenance inclus" }
        ]
      }
    };

    let cart = [];
    let compareList = [];

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
    
    function getActiveEmail() { return localStorage.getItem('p2i_user_email') || localStorage.getItem('p2i_active_user') || ''; }
    
    function getUrlParams() {
      const p = new URLSearchParams(window.location.search);
      return { 
        upId: p.get('up_id') || '', 
        upNom: decodeURIComponent(p.get('up_nom') || ''), 
        filiere: decodeURIComponent(p.get('filiere') || ''), 
        machineId: p.get('machine_id') || '', 
        machineName: decodeURIComponent(p.get('machine_name') || ''), 
        machineRole: decodeURIComponent(p.get('machine_role') || ''), 
        machineCapacity: decodeURIComponent(p.get('machine_capacity') || ''), 
        machineUtilities: decodeURIComponent(p.get('machine_utilities') || '')
      };
    }

    function getMachineRefKey(name) {
      const n = (name || '').toLowerCase();
      if (n.includes('boulangerie') || n.includes('boulangerie industrielle')) return 'boulangerie_industrielle';
      if (n.includes('diviseuse')) return 'diviseuse_bouleuse';
      if (n.includes('four')) return 'four_tunnel';
      if (n.includes('pétrin') || n.includes('petrin')) return 'boulangerie_industrielle';
      return null;
    }

    function displayMachineInfo(params) {
      document.getElementById('upName').innerHTML = `<i class="fas fa-building"></i> ${escapeHtml(params.upNom || 'Unité inconnue')}`;
      document.getElementById('upFiliere').innerHTML = `<i class="fas fa-chart-line"></i> ${escapeHtml(params.filiere || 'Filière non spécifiée')}`;
      document.getElementById('machineName').innerHTML = `<i class="fas fa-industry"></i> ${escapeHtml(params.machineName || 'Machine inconnue')}`;
      document.getElementById('machineRole').innerHTML = `<i class="fas fa-tasks"></i> ${escapeHtml(params.machineRole || 'Rôle non spécifié')}`;
      document.getElementById('machineCapacity').innerHTML = `<i class="fas fa-weight-hanging"></i> ${escapeHtml(params.machineCapacity || 'Capacité non spécifiée')}`;
      document.getElementById('machineUtilities').innerHTML = `<i class="fas fa-bolt"></i> ${escapeHtml(params.machineUtilities || 'Utilités non spécifiées')}`;
    }

    function getMachineImage(modelName) {
      return '';
    }

    function displayModels(params) {
      const grid = document.getElementById('modelsGrid');
      const machineKey = getMachineRefKey(params.machineName);
      
      if (!machineKey || !MODELS_DB[machineKey]) {
        grid.innerHTML = '<div style="text-align:center;padding:50px;"><i class="fas fa-search" style="font-size:2rem;"></i><p>Aucun modèle disponible pour cette machine.</p><p style="font-size:0.8rem;">Contactez-nous pour un devis personnalisé.</p></div>';
        return;
      }
      
      const models = MODELS_DB[machineKey].models;
      
      grid.innerHTML = models.map(m => {
        const fullStars = Math.floor(m.rating);
        const hasHalfStar = m.rating % 1 >= 0.5;
        let ratingStars = '';
        for (let i = 0; i < fullStars; i++) ratingStars += '<i class="fas fa-star" style="color:#fbbf24"></i>';
        if (hasHalfStar) ratingStars += '<i class="fas fa-star-half-alt" style="color:#fbbf24"></i>';
        const emptyStars = 5 - Math.ceil(m.rating);
        for (let i = 0; i < emptyStars; i++) ratingStars += '<i class="far fa-star" style="color:#4b5563"></i>';
        
        return `
          <div class="model-card">
            <div class="model-badge"><i class="fas fa-check-circle"></i> Certifié P2I</div>
            <div class="model-content">
              <h3 class="model-name">${escapeHtml(m.name)}</h3>
              <div class="model-price">${m.price_ttc.toLocaleString()} $ <small>TTC / FOB</small></div>
              <div class="rating">${ratingStars} <span style="color:#94a3b8;">(${m.rating} - ${m.review_count} avis)</span></div>
              <div class="supplier-info">
                <i class="fas fa-store"></i> <strong>${escapeHtml(m.supplier)}</strong><br>
                <span class="supplier-status"><i class="fas fa-certificate"></i> ${escapeHtml(m.supplier_status)}</span>
              </div>
              <div class="specs-grid">
                <div class="spec-item"><span>⚡ Puissance :</span> ${escapeHtml(m.specs.power)}</div>
                <div class="spec-item"><span>📦 Capacité :</span> ${escapeHtml(m.specs.capacity)}</div>
                <div class="spec-item"><span>📐 Dimensions :</span> ${escapeHtml(m.specs.dimensions)}</div>
                <div class="spec-item"><span>⚖️ Poids :</span> ${escapeHtml(m.specs.weight)}</div>
                <div class="spec-item"><span>🔩 Matériau :</span> ${escapeHtml(m.specs.material)}</div>
                <div class="spec-item"><span>🛡️ Garantie :</span> ${escapeHtml(m.warranty)}</div>
              </div>
              <div class="delivery-info"><i class="fas fa-truck"></i> Délai : ${escapeHtml(m.delivery)}</div>
              <div class="after-sales"><i class="fas fa-tools"></i> Pièces détachées : ${escapeHtml(m.parts_available)}<br><i class="fas fa-headset"></i> SAV : ${escapeHtml(m.after_sales)}</div>
              <div class="model-actions">
                <button class="btn-sm btn-quote" onclick="requestQuoteAndRedirect('${params.upId}', '${escapeHtml(params.upNom)}', '${escapeHtml(params.machineName)}', '${escapeHtml(m.name)}', ${m.price_ttc})">
                  <i class="fas fa-file-invoice"></i> Devis officiel
                </button>
                <button class="btn-sm btn-cart" onclick="addToCart('${escapeHtml(m.name)}', ${m.price_ttc})">
                  <i class="fas fa-cart-plus"></i> Panier
                </button>
                <button class="btn-sm btn-save" onclick="saveToDashboard('${params.upId}', '${escapeHtml(params.upNom)}', '${escapeHtml(params.machineName)}', '${escapeHtml(m.name)}', ${m.price_ttc})">
                  <i class="fas fa-save"></i> Enregistrer
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function requestQuoteAndRedirect(upId, upNom, machineName, modelName, price) {
      const email = getActiveEmail();
      if (!email) {
        alert('Veuillez vous connecter pour générer un devis officiel.');
        window.location.href = 'login.html?mode=login&redirect=' + encodeURIComponent(window.location.href);
        return;
      }
      
      const url = `devis-detail.html?up_id=${upId}&up_nom=${encodeURIComponent(upNom)}&machine_name=${encodeURIComponent(machineName)}&model_name=${encodeURIComponent(modelName)}&price=${price}`;
      window.location.href = url;
    }

    // Gestion du panier
    function loadCart() { const saved = localStorage.getItem('p2i_machines_cart'); if (saved) try { cart = JSON.parse(saved); } catch(e) { cart = []; } updateCartBadge(); }
    function saveCart() { localStorage.setItem('p2i_machines_cart', JSON.stringify(cart)); updateCartBadge(); }
    function updateCartBadge() { document.getElementById('cartCount').textContent = cart.length; }
    function addToCart(name, price) { cart.push({ name, price, date: new Date().toISOString() }); saveCart(); showToast(`✓ "${name}" ajouté au panier`); renderCartModal(); }
    function removeFromCart(index) { cart.splice(index, 1); saveCart(); renderCartModal(); showToast("Article retiré du panier"); }
    
    function renderCartModal() {
      const container = document.getElementById('cartItemsList');
      const totalSpan = document.getElementById('cartTotalDisplay');
      if (!container) return;
      if (cart.length === 0) { container.innerHTML = '<div class="empty-cart">Aucun article</div>'; totalSpan.innerHTML = '<span>Total TTC</span><span>0 $</span>'; return; }
      let total = 0;
      container.innerHTML = cart.map((item, idx) => { total += item.price; return `<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${escapeHtml(item.name)}</div><div class="cart-item-price">${item.price.toLocaleString()} $</div></div><button class="cart-item-remove" onclick="removeFromCart(${idx})"><i class="fas fa-trash"></i></button></div>`; }).join('');
      totalSpan.innerHTML = `<span>Total TTC</span><span>${total.toLocaleString()} $</span>`;
    }
    
    function openCartModal() { document.getElementById('cartModal').style.display = 'flex'; renderCartModal(); }
    function closeCartModal() { document.getElementById('cartModal').style.display = 'none'; }
    
    function checkoutCart() {
      if (cart.length === 0) { alert('Votre panier est vide.'); return; }
      const useAlibaba = confirm(`🛒 ${cart.length} article(s) dans votre panier.\n\n• OK → Alibaba (Trade Assurance)\n• Annuler → Made-in-China (Secure Payment)`);
      const searchTerms = cart.map(item => encodeURIComponent(item.name)).join('+');
      const url = useAlibaba ? `https://www.alibaba.com/trade/search?SearchText=${searchTerms}` : `https://fr.made-in-china.com/recherche/recherche.do?word=${searchTerms}`;
      window.open(url, '_blank');
      
      // Sauvegarder la commande
      const email = getActiveEmail();
      if (email) {
        const order = { id: 'order_' + Date.now(), date: new Date().toISOString(), items: [...cart], platform: useAlibaba ? 'Alibaba' : 'Made-in-China' };
        let orders = JSON.parse(localStorage.getItem(`p2i_orders_${email}`) || '[]');
        orders.push(order);
        localStorage.setItem(`p2i_orders_${email}`, JSON.stringify(orders));
      }
      
      cart = [];
      saveCart();
      closeCartModal();
      showToast("Redirection vers la plateforme de vente");
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      setTimeout(() => t.style.opacity = '0', 3000);
    }
function saveToDashboard(upId, upNom, machineName, modelName, price, machineRole, machineCapacity, machineUtilities) {
  const email = getActiveEmail();
  if (!email) { alert('Veuillez vous connecter.'); window.location.href = 'login.html?mode=login'; return; }
  
  const savedKey = `p2i_saved_machines__${email}`;
  let saved = JSON.parse(localStorage.getItem(savedKey) || '[]');
  
  if (!saved.some(m => m.model === modelName)) {
    saved.push({ 
      up_id: upId, 
      up_nom: upNom, 
      machine: machineName, 
      model: modelName, 
      price: price,
      machine_role: machineRole,
      machine_capacity: machineCapacity,
      machine_utilities: machineUtilities,
      saved_at: new Date().toISOString() 
    });
    localStorage.setItem(savedKey, JSON.stringify(saved));
    showToast(`✅ "${modelName}" enregistré dans le Dashboard`);
  } else {
    showToast(`ℹ️ "${modelName}" déjà enregistré`);
  }
}

    function goBack() { window.history.back(); }

    function init() {
      const params = getUrlParams();
      displayMachineInfo(params);
      displayModels(params);
      loadCart();
      
      window.addToCart = addToCart;
      window.removeFromCart = removeFromCart;
      window.saveToDashboard = saveToDashboard;
      window.checkoutCart = checkoutCart;
      window.goBack = goBack;
      window.openCartModal = openCartModal;
      window.closeCartModal = closeCartModal;
      window.requestQuoteAndRedirect = requestQuoteAndRedirect;
    }
    
    init();
  </script>
