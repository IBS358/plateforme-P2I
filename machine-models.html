<html lang="fr">

  <title>P2I - Modèles de machines industrielles</title>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
      color: white;
      min-height: 100vh;
      padding: 100px 20px 40px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header navigation */
    .nav-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(13, 27, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid rgba(76, 201, 240, 0.2);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      background: linear-gradient(135deg, #4cc9f0, #f72585);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .cart-icon {
      position: relative;
      cursor: pointer;
      font-size: 1.5rem;
      color: #4cc9f0;
      transition: all 0.3s;
    }
    .cart-icon:hover { transform: scale(1.1); }
    .cart-count {
      position: absolute;
      top: -10px;
      right: -10px;
      background: #f72585;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Info machine */
    .machine-info {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 30px;
      border: 1px solid rgba(76, 201, 240, 0.2);
    }
    .machine-info h2 { color: #4cc9f0; margin-bottom: 10px; }
    .machine-badge {
      display: inline-block;
      background: rgba(76, 201, 240, 0.2);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-right: 10px;
    }
    .specs-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin: 5px 5px 0 0;
    }

    /* Grille des modèles */
    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }
    .model-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    .model-card:hover {
      transform: translateY(-8px);
      border-color: #4cc9f0;
      box-shadow: 0 20px 30px rgba(76, 201, 240, 0.2);
    }
    .model-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  background: linear-gradient(135deg, #4cc9f0, #f72585);
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.65rem;
  font-weight: bold;
  z-index: 2;
  white-space: nowrap;
}

.model-content { 
  padding: 20px;
  overflow: hidden; /* Évite les débordements */
}

.model-name { 
  font-size: clamp(0.95rem, 4vw, 1.2rem); /* Taille responsive */
  margin-bottom: 10px;
  margin-right: 85px; /* Place réservée pour le badge */
  color: #4cc9f0;
  font-weight: bold;
  line-height: 1.3;
  word-break: break-word; /* Coupe les mots trop longs */
  min-height: 50px; /* Stabilité sur toutes les cartes */
}
    .model-price {
      font-size: 1.5rem;
      font-weight: bold;
      color: #22c55e;
      margin-bottom: 10px;
    }
    .model-price small { font-size: 0.8rem; color: #94a3b8; }
    
    .rating {
      color: #fbbf24;
      margin-bottom: 10px;
    }
    .supplier-info {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 0.85rem;
    }
    .supplier-status {
      color: #22c55e;
      font-weight: bold;
    }
    .specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 15px 0;
      font-size: 0.8rem;
    }
    .spec-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 8px;
      border-radius: 8px;
    }
    .spec-item span { color: #94a3b8; }
    .delivery-info {
      font-size: 0.8rem;
      color: #4cc9f0;
      margin: 10px 0;
    }
    .warranty-badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      margin-right: 5px;
    }
    .after-sales {
      font-size: 0.75rem;
      color: #94a3b8;
      margin: 8px 0;
    }
    .model-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .btn-sm {
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
      flex: 1;
      text-align: center;
    }
    .btn-quote {
      background: linear-gradient(135deg, #4cc9f0, #4361ee);
      color: white;
    }
    .btn-quote:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(76, 201, 240, 0.4); }
    .btn-cart {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-cart:hover { background: rgba(76, 201, 240, 0.3); }
    .btn-save {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .btn-save:hover { background: rgba(34, 197, 94, 0.4); }
    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: none;
      transition: all 0.3s;
    }
    .btn-back:hover { background: rgba(76, 201, 240, 0.3); }

    .modal {

      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1e293b;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .cart-items { max-height: 300px; overflow-y: auto; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid rgba(255,255,255,0.2);
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }
    .btn-checkout {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #4cc9f0, #f72585);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }
    .close-modal {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: white;
      padding: 10px 20px;
      border-radius: 50px;
      z-index: 1100;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }
    
    function getActiveEmail() { return localStorage.getItem('p2i_user_email') || localStorage.getItem('p2i_active_user') || ''; }
    
    function getUrlParams() {
      const p = new URLSearchParams(window.location.search);
      return { 
        upId: p.get('up_id') || '', 
        upNom: decodeURIComponent(p.get('up_nom') || ''), 
        filiere: decodeURIComponent(p.get('filiere') || ''), 
        machineId: p.get('machine_id') || '', 
        machineName: decodeURIComponent(p.get('machine_name') || ''), 
        machineRole: decodeURIComponent(p.get('machine_role') || ''), 
        machineCapacity: decodeURIComponent(p.get('machine_capacity') || ''), 
        machineUtilities: decodeURIComponent(p.get('machine_utilities') || '')
      };
    }

    function getMachineRefKey(name) {
  const n = (name || '').toLowerCase(); 
  // ==============================================
  // BOULANGERIE INDUSTRIELLE
  // ==============================================
  
  // Pétrin
  if (n.includes('pétrin') || n.includes('petrin')) return 'petrin_spiral';
  
  // Diviseuse
  if (n.includes('diviseuse')) return 'diviseuse_bouleuse';
  
  // Façonneuse
  if (n.includes('façonneuse') || n.includes('faconneuse')) return 'faconneuse';
  
  // Chambre de pousse / fermentation
  if ((n.includes('chambre') && n.includes('pousse')) || 
      (n.includes('chambre') && n.includes('fermentation'))) return 'chambre_pousse';
  
  // Four tunnel / rotatif
  if ((n.includes('four') && n.includes('tunnel')) || 
      (n.includes('four') && n.includes('rotatif'))) return 'four_tunnel';
  
  // Trancheuse
  if (n.includes('trancheuse')) return 'trancheuse';
  
  // Emballeuse / ensacheuse
  if (n.includes('emballeuse') || n.includes('ensacheuse')) return 'emballeuse';
  
  
  // ==============================================
  // CONSERVERIE DE LÉGUMES
  // ==============================================
  
  // Laveuse-découpeuse
  if (n.includes('laveuse') || n.includes('découpeuse') || n.includes('decoupeuse')) return 'laveuse_decoupeuse';
  
  // Blanchisseur
  if (n.includes('blanchisseur') || n.includes('blanchiment')) return 'blanchisseur';
  
  // Remplisseuse-doseuse
  if (n.includes('remplisseuse') || n.includes('doseuse')) return 'remplisseuse_doseuse';
  
  // Scelleuse-operculieuse
  if (n.includes('scelleuse') || n.includes('operculieuse')) return 'scelleuse_operculieuse';
  
  // Autoclave / stérilisateur
  if (n.includes('autoclave') || n.includes('stérilisateur') || n.includes('sterilisateur')) return 'autoclave';
  
  // Étiqeteuse
  if (n.includes('étiqueteuse') || n.includes('etiqueteuse')) return 'etiqueteuse';
  
  // Cartonneuse / emballeuse secondaire
  if (n.includes('cartonneuse') || (n.includes('conditionnement') && n.includes('secondaire'))) return 'cartonneuse_emballeuse';
// ==============================================
// BISCUITERIE INDUSTRIELLE
// ==============================================

// Mélangeur / pétrin biscuiterie
if (n.includes('mélangeur') || n.includes('melangeur') || (n.includes('pétrin') && n.includes('biscuit'))) return 'melangeur_biscuiterie';

// Lamineuse
if (n.includes('lamineuse')) return 'lamineuse_biscuiterie';

// Façonneuse rotative
if ((n.includes('façonneuse') || n.includes('faconneuse')) && n.includes('rotative')) return 'faconneuse_rotative';
if (n.includes('rotative') && n.includes('biscuit')) return 'faconneuse_rotative';

// Four à biscuits
if (n.includes('four') && (n.includes('biscuit') || n.includes('biscuiterie'))) return 'four_biscuiterie';

// Refroidisseur
if (n.includes('refroidisseur')) return 'refroidisseur_biscuiterie';

// Enrobeuse / saupoudreuse
if (n.includes('enrobeuse') || n.includes('saupoudreuse')) return 'enrobeuse_saupoudreuse';

// Emballeuse horizontale
if (n.includes('emballeuse') && n.includes('horizontale')) return 'emballeuse_horizontale';
// ==============================================
// JUS & BOISSONS
// ==============================================

// Laveuse-trieuse
if (n.includes('laveuse') || (n.includes('trieuse'))) return 'laveuse_trieuse';

// Éplucheuse-dénoyauteuse
if (n.includes('éplucheuse') || n.includes('eplucheuse') || n.includes('dénoyauteuse')) return 'eplucheuse_denoyauteuse';

// Broyeur-raspeur
if (n.includes('broyeur') || n.includes('raspeur')) return 'broyeur_raspeur';

// Filtreuse / tamiseuse
if (n.includes('filtreuse') || n.includes('tamiseuse')) return 'filtreuse_tamiseuse';

// Mélangeuse / doseuse
if ((n.includes('mélangeuse') || n.includes('melangeuse')) || n.includes('doseuse')) return 'melangeuse_doseuse';

// Pasteurisateur
if (n.includes('pasteurisateur')) return 'pasteurisateur';

// Remplisseuse-scelleuse
if ((n.includes('remplisseuse') || n.includes('scelleuse'))) return 'remplisseuse_scelleuse';

// Concentrateur / évaporateur
if (n.includes('concentrateur') || n.includes('évaporateur') || n.includes('evaporateur')) return 'concentrateur_evaporateur';
// ==============================================
// HUILES ALIMENTAIRES
// ==============================================

// Nettoyeur-décortiqueur
if (n.includes('nettoyeur') || n.includes('décortiqueur') || n.includes('decortiqueur')) return 'nettoyeur_decortiqueur';

// Broyeur / concasseur
if (n.includes('concasseur')) return 'broyeur_concasseur_huile';
if ((n.includes('broyeur') && n.includes('huile')) || (n.includes('broyeur') && n.includes('graine'))) return 'broyeur_concasseur_huile';

// Cuiseur
if (n.includes('cuiseur')) return 'cuiseur_huile';

// Presse à huile (UNIQUEMENT cette ligne)
if (n.includes('presse') && n.includes('huile') && !n.includes('filtre')) return 'presse_huile';

// Filtre-presse
if (n.includes('filtre') && n.includes('presse')) return 'filtre_presse_huile';

// Clarificateur / décanteuse
if (n.includes('clarificateur') || n.includes('décanteuse') || n.includes('decanteuse')) return 'clarificateur_decanteuse';

// Remplisseuse (huile)
if (n.includes('remplisseuse') && (n.includes('huile') || n.includes('bidon'))) return 'remplisseuse_huile';

// MODULE RAFFINERIE
if (n.includes('neutraliseur')) return 'neutraliseur_huile';
if (n.includes('décoloreur') || n.includes('decoloreur')) return 'decoloreur_huile';
if (n.includes('désodoriseur') || n.includes('desodoriseur')) return 'desodoriseur_huile';
if (n.includes('fractionneur')) return 'fractionneur_huile';
// ==============================================
// TRANSFORMATION D'ÉPICES
// ==============================================

// Laveuse-décanteuse
if (n.includes('laveuse')) return 'laveuse_decanteuse_epices';

// Séchoir
if (n.includes('séchoir') || n.includes('sechoir')) return 'sechoir_epices';

// Broyeur
if (n.includes('broyeur')) return 'broyeur_epices';

// Tamiseuse
if (n.includes('tamiseuse')) return 'tamiseuse_epices';

// Mélangeuse
if (n.includes('mélangeuse') || n.includes('melangeuse')) return 'melangeuse_epices';

// Conditionneuse
if (n.includes('conditionneuse')) return 'conditionneuse_sachets';

// Étiqeteuse
if (n.includes('étiqueteuse') || n.includes('etiqueteuse')) return 'etiqueteuse_epices';
// ==============================================
// MINI-LAITERIE
// ==============================================

if (n.includes('cuve') && n.includes('réception')) return 'cuve_reception';
if (n.includes('pasteurisateur')) return 'pasteurisateur_lait';
if (n.includes('écrémeuse') || n.includes('ecremeuse')) return 'ecremeuse';
if (n.includes('maturation')) return 'cuve_maturation';
if (n.includes('remplisseuse')) return 'remplisseuse_lait';
if (n.includes('chambre') && n.includes('froide')) return 'chambre_froide';  
  
  // ==============================================
  // FALLBACK (anciens noms)
  // ==============================================
  if (n.includes('boulangerie') || n.includes('boulangerie industrielle')) return 'petrin_spiral';
  
  return null;
}

    function displayModels(params) {
  const grid = document.getElementById('modelsGrid');
  
  // PRIORITÉ ABSOLUE au machine_key
  let machineKey = null;
  if (params.machine_key && MODELS_DB[params.machine_key]) {
    machineKey = params.machine_key;
  }
  
  // Fallback : rechercher par nom
  if (!machineKey) {
    machineKey = getMachineRefKey(params.machineName);
  }
  
  // Fallback 2 : recherche dans MODELS_DB
  if (!machineKey) {
    for (const key in MODELS_DB) {
      const machine = MODELS_DB[key];
      if (machine.machine_name && params.machineName && 
          machine.machine_name.toLowerCase() === params.machineName.toLowerCase()) {
        machineKey = key;
        break;
      }
    }
  }
  
  if (!machineKey || !MODELS_DB[machineKey]) {
    grid.innerHTML = '<div style="text-align:center;padding:50px;"><i class="fas fa-search" style="font-size:2rem;"></i><p>Aucun modèle disponible pour cette machine.</p><p style="font-size:0.8rem;">Contactez-nous pour un devis personnalisé.</p></div>';
    return;
  }
    
  const machine = MODELS_DB[machineKey];
  const models = machine.models;
  
  // Affichage des infos machine
  document.getElementById('machineName').innerHTML = `<i class="fas fa-industry"></i> ${escapeHtml(machine.machine_name || params.machineName)}`;
  document.getElementById('machineRole').innerHTML = `<i class="fas fa-tasks"></i> ${escapeHtml(machine.machine_role || params.machineRole || 'Rôle non spécifié')}`;
  document.getElementById('machineCapacity').innerHTML = `<i class="fas fa-weight-hanging"></i> ${escapeHtml(machine.default_capacity || params.machineCapacity || 'Capacité non spécifiée')}`;
  document.getElementById('machineUtilities').innerHTML = `<i class="fas fa-bolt"></i> ${escapeHtml(machine.default_utilities || params.machineUtilities || 'Utilités non spécifiées')}`;
  
  // Affichage des modèles
  grid.innerHTML = models.map(m => {
    const fullStars = Math.floor(m.rating);
    const hasHalfStar = m.rating % 1 >= 0.5;
    let ratingStars = '';
    for (let i = 0; i < fullStars; i++) ratingStars += '<i class="fas fa-star" style="color:#fbbf24"></i>';
    if (hasHalfStar) ratingStars += '<i class="fas fa-star-half-alt" style="color:#fbbf24"></i>';
    const emptyStars = 5 - Math.ceil(m.rating);
    for (let i = 0; i < emptyStars; i++) ratingStars += '<i class="far fa-star" style="color:#4b5563"></i>';
    
    return `
      <div class="model-card">
        <div class="model-badge"><i class="fas fa-check-circle"></i> Certifié P2I</div>
        <div class="model-content">
          <h3 class="model-name">${escapeHtml(m.name)}</h3>
          <div class="model-price">${m.price_ttc.toLocaleString()} $ <small>TTC / FOB</small></div>
          <div class="rating">${ratingStars} <span style="color:#94a3b8;">(${m.rating} - ${m.review_count} avis)</span></div>
          <div class="supplier-info">
            <i class="fas fa-store"></i> <strong>${escapeHtml(m.supplier)}</strong><br>
            <span class="supplier-status"><i class="fas fa-certificate"></i> ${escapeHtml(m.supplier_status)}</span>
          </div>
          <div class="specs-grid">
            <div class="spec-item"><span>⚡ Puissance :</span> ${escapeHtml(m.specs.power)}</div>
            <div class="spec-item"><span>📦 Capacité :</span> ${escapeHtml(m.specs.capacity)}</div>
            <div class="spec-item"><span>📐 Dimensions :</span> ${escapeHtml(m.specs.dimensions)}</div>
            <div class="spec-item"><span>⚖️ Poids :</span> ${escapeHtml(m.specs.weight)}</div>
            <div class="spec-item"><span>🔩 Matériau :</span> ${escapeHtml(m.specs.material)}</div>
            <div class="spec-item"><span>🛡️ Garantie :</span> ${escapeHtml(m.warranty)}</div>
          </div>
          <div class="delivery-info"><i class="fas fa-truck"></i> Délai : ${escapeHtml(m.delivery)}</div>
          <div class="after-sales"><i class="fas fa-tools"></i> Pièces détachées : ${escapeHtml(m.parts_available)}<br><i class="fas fa-headset"></i> SAV : ${escapeHtml(m.after_sales)}</div>
          <div class="model-actions">
            <button class="btn-sm btn-quote" onclick="requestQuoteAndRedirect('${params.upId}', '${escapeHtml(params.upNom)}', '${escapeHtml(machine.machine_name || params.machineName)}', '${escapeHtml(m.name)}', ${m.price_ttc})">
              <i class="fas fa-file-invoice"></i> Devis officiel
            </button>
            <button class="btn-sm btn-cart" onclick="addToCart('${escapeHtml(m.name)}', ${m.price_ttc})">
              <i class="fas fa-cart-plus"></i> Panier
            </button>
            <button class="btn-sm btn-save" onclick="saveToDashboard('${params.upId}', '${escapeHtml(params.upNom)}', '${escapeHtml(machine.machine_name || params.machineName)}', '${escapeHtml(m.name)}', ${m.price_ttc}, '${escapeHtml(machine.machine_role || params.machineRole)}', '${escapeHtml(machine.default_capacity || params.machineCapacity)}', '${escapeHtml(machine.default_utilities || params.machineUtilities)}')">
              <i class="fas fa-save"></i> Enregistrer
            </button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

    function requestQuoteAndRedirect(upId, upNom, machineName, modelName, price) {
      const email = getActiveEmail();
      if (!email) {
        alert('Veuillez vous connecter pour générer un devis officiel.');
        window.location.href = 'login.html?mode=login&redirect=' + encodeURIComponent(window.location.href);
        return;
      }
      
      const url = `devis-detail.html?up_id=${upId}&up_nom=${encodeURIComponent(upNom)}&machine_name=${encodeURIComponent(machineName)}&model_name=${encodeURIComponent(modelName)}&price=${price}`;
      window.location.href = url;
    }

    // Gestion du panier
    function loadCart() { const saved = localStorage.getItem('p2i_machines_cart'); if (saved) try { cart = JSON.parse(saved); } catch(e) { cart = []; } updateCartBadge(); }
    function saveCart() { localStorage.setItem('p2i_machines_cart', JSON.stringify(cart)); updateCartBadge(); }
    function updateCartBadge() { document.getElementById('cartCount').textContent = cart.length; }
    function addToCart(name, price) { cart.push({ name, price, date: new Date().toISOString() }); saveCart(); showToast(`✓ "${name}" ajouté au panier`); renderCartModal(); }
    function removeFromCart(index) { cart.splice(index, 1); saveCart(); renderCartModal(); showToast("Article retiré du panier"); }
    
    function renderCartModal() {
      const container = document.getElementById('cartItemsList');
      const totalSpan = document.getElementById('cartTotalDisplay');
      if (!container) return;
      if (cart.length === 0) { container.innerHTML = '<div class="empty-cart">Aucun article</div>'; totalSpan.innerHTML = '<span>Total TTC</span><span>0 $</span>'; return; }
      let total = 0;
      container.innerHTML = cart.map((item, idx) => { total += item.price; return `<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${escapeHtml(item.name)}</div><div class="cart-item-price">${item.price.toLocaleString()} $</div></div><button class="cart-item-remove" onclick="removeFromCart(${idx})"><i class="fas fa-trash"></i></button></div>`; }).join('');
      totalSpan.innerHTML = `<span>Total TTC</span><span>${total.toLocaleString()} $</span>`;
    }
    
    function openCartModal() { document.getElementById('cartModal').style.display = 'flex'; renderCartModal(); }
    function closeCartModal() { document.getElementById('cartModal').style.display = 'none'; }
    
    function checkoutCart() {
      if (cart.length === 0) { alert('Votre panier est vide.'); return; }
      const useAlibaba = confirm(`🛒 ${cart.length} article(s) dans votre panier.\n\n• OK → Alibaba (Trade Assurance)\n• Annuler → Made-in-China (Secure Payment)`);
      const searchTerms = cart.map(item => encodeURIComponent(item.name)).join('+');
      const url = useAlibaba ? `https://www.alibaba.com/trade/search?SearchText=${searchTerms}` : `https://fr.made-in-china.com/recherche/recherche.do?word=${searchTerms}`;
      window.open(url, '_blank');
      
      // Sauvegarder la commande
      const email = getActiveEmail();
      if (email) {
        const order = { id: 'order_' + Date.now(), date: new Date().toISOString(), items: [...cart], platform: useAlibaba ? 'Alibaba' : 'Made-in-China' };
        let orders = JSON.parse(localStorage.getItem(`p2i_orders_${email}`) || '[]');
        orders.push(order);
        localStorage.setItem(`p2i_orders_${email}`, JSON.stringify(orders));
      }
      
      cart = [];
      saveCart();
      closeCartModal();
      showToast("Redirection vers la plateforme de vente");
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      setTimeout(() => t.style.opacity = '0', 3000);
    }
function saveToDashboard(upId, upNom, machineName, modelName, price, machineRole, machineCapacity, machineUtilities) {
  const email = getActiveEmail();
  if (!email) { alert('Veuillez vous connecter.'); window.location.href = 'login.html?mode=login'; return; }
  
  const savedKey = `p2i_saved_machines__${email}`;
  let saved = JSON.parse(localStorage.getItem(savedKey) || '[]');
  
  if (!saved.some(m => m.model === modelName)) {
    saved.push({ 
      up_id: upId, 
      up_nom: upNom, 
      machine: machineName, 
      model: modelName, 
      price: price,
      machine_role: machineRole,
      machine_capacity: machineCapacity,
      machine_utilities: machineUtilities,
      saved_at: new Date().toISOString() 
    });
    localStorage.setItem(savedKey, JSON.stringify(saved));
    showToast(`✅ "${modelName}" enregistré dans le Dashboard`);
  } else {
    showToast(`ℹ️ "${modelName}" déjà enregistré`);
  }
}

    function goBack() { window.history.back(); }

    function init() {
      const params = getUrlParams();
      displayMachineInfo(params);
      displayModels(params);
      loadCart();
      
      window.addToCart = addToCart;
      window.removeFromCart = removeFromCart;
      window.saveToDashboard = saveToDashboard;
      window.checkoutCart = checkoutCart;
      window.goBack = goBack;
      window.openCartModal = openCartModal;
      window.closeCartModal = closeCartModal;
      window.requestQuoteAndRedirect = requestQuoteAndRedirect;
    }
    
    init();
  </script>
