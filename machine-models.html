<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P2I - Modèles de machines industrielles</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
      color: white;
      min-height: 100vh;
      padding: 100px 20px 40px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Header navigation */
    .nav-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(13, 27, 42, 0.95);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      border-bottom: 1px solid rgba(76, 201, 240, 0.2);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      background: linear-gradient(135deg, #4cc9f0, #f72585);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .cart-icon {
      position: relative;
      cursor: pointer;
      font-size: 1.5rem;
      color: #4cc9f0;
      transition: all 0.3s;
    }
    .cart-icon:hover { transform: scale(1.1); }
    .cart-count {
      position: absolute;
      top: -10px;
      right: -10px;
      background: #f72585;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Info machine */
    .machine-info {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 30px;
      border: 1px solid rgba(76, 201, 240, 0.2);
    }
    .machine-info h2 { color: #4cc9f0; margin-bottom: 10px; }
    .machine-badge {
      display: inline-block;
      background: rgba(76, 201, 240, 0.2);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin-right: 10px;
    }
    .specs-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      margin: 5px 5px 0 0;
    }

    /* Grille des modèles */
    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 25px;
      margin-top: 20px;
    }
    .model-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    .model-card:hover {
      transform: translateY(-8px);
      border-color: #4cc9f0;
      box-shadow: 0 20px 30px rgba(76, 201, 240, 0.2);
    }
    .model-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #4cc9f0, #f72585);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: bold;
      z-index: 2;
      white-space: nowrap;
    }
    .model-content { 
      padding: 20px;
      overflow: hidden;
    }
    .model-name { 
      font-size: clamp(0.95rem, 4vw, 1.2rem);
      margin-bottom: 10px;
      margin-right: 85px;
      color: #4cc9f0;
      font-weight: bold;
      line-height: 1.3;
      word-break: break-word;
      min-height: 50px;
    }
    .model-price {
      font-size: 1.5rem;
      font-weight: bold;
      color: #22c55e;
      margin-bottom: 10px;
    }
    .model-price small { font-size: 0.8rem; color: #94a3b8; }
    
    .rating {
      color: #fbbf24;
      margin-bottom: 10px;
    }
    .supplier-info {
      background: rgba(255, 255, 255, 0.05);
      padding: 10px;
      border-radius: 10px;
      margin: 10px 0;
      font-size: 0.85rem;
    }
    .supplier-status {
      color: #22c55e;
      font-weight: bold;
    }
    .specs-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin: 15px 0;
      font-size: 0.8rem;
    }
    .spec-item {
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 8px;
      border-radius: 8px;
    }
    .spec-item span { color: #94a3b8; }
    .delivery-info {
      font-size: 0.8rem;
      color: #4cc9f0;
      margin: 10px 0;
    }
    .warranty-badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.7rem;
      margin-right: 5px;
    }
    .after-sales {
      font-size: 0.75rem;
      color: #94a3b8;
      margin: 8px 0;
    }

    /* ===== ORIGINES DES MODÈLES ===== */
    .model-origins {
      margin: 15px 0 10px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .origins-label {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 10px;
      font-weight: 600;
      text-align: center;
    }
    .origin-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .origin-option {
      flex: 1;
      min-width: 90px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
    }
    .origin-option:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }
    .origin-option.korean {
      border-color: rgba(76, 201, 240, 0.25);
    }
    .origin-option.korean:hover,
    .origin-option.korean.selected {
      border-color: #4cc9f0;
      background: rgba(76, 201, 240, 0.10);
      box-shadow: 0 0 15px rgba(76, 201, 240, 0.1);
    }
    .origin-option.chinese {
      border-color: rgba(255, 193, 7, 0.2);
    }
    .origin-option.chinese:hover,
    .origin-option.chinese.selected {
      border-color: #ffc107;
      background: rgba(255, 193, 7, 0.08);
    }
    .origin-option.europe {
      border-color: rgba(40, 167, 69, 0.2);
    }
    .origin-option.europe:hover,
    .origin-option.europe.selected {
      border-color: #28a745;
      background: rgba(40, 167, 69, 0.08);
    }
    .origin-badge {
      display: block;
      font-size: 0.65rem;
      font-weight: 700;
      margin-bottom: 3px;
    }
    .origin-option.korean .origin-badge { color: #4cc9f0; }
    .origin-option.chinese .origin-badge { color: #ffc107; }
    .origin-option.europe .origin-badge { color: #28a745; }
    .origin-price {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: white;
    }
    .origin-features {
      display: block;
      font-size: 0.55rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .model-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }
    .btn-sm {
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
      flex: 1;
      text-align: center;
    }
    .btn-quote {
      background: linear-gradient(135deg, #4cc9f0, #4361ee);
      color: white;
    }
    .btn-quote:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(76, 201, 240, 0.4); }
    .btn-cart {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-cart:hover { background: rgba(76, 201, 240, 0.3); }
    .btn-save {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .btn-save:hover { background: rgba(34, 197, 94, 0.4); }
    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: none;
      transition: all 0.3s;
    }
    .btn-back:hover { background: rgba(76, 201, 240, 0.3); }

    /* Modal panier */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #1e293b;
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .cart-items { max-height: 300px; overflow-y: auto; }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .cart-total {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid rgba(255,255,255,0.2);
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }
    .btn-checkout {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #4cc9f0, #f72585);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }
    .close-modal {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: white;
      padding: 10px 20px;
      border-radius: 50px;
      z-index: 1100;
      font-size: 0.85rem;
      opacity: 0;
      transition: opacity 0.3s;
    }

    @media (max-width: 600px) {
      .models-grid { grid-template-columns: 1fr; }
      .specs-grid { grid-template-columns: 1fr; }
      .model-actions { flex-direction: column; }
      .origin-options { flex-direction: column; }
      .origin-option { min-width: unset; width: 100%; }
    }
    @keyframes fadeIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

// ==============================================
// getMachineRefKey
// Correspondance machine → clé MODELS_DB
// ==============================================

function getMachineRefKey(name) {
  const originalName = (name || '').trim();
  const n = originalName.toLowerCase();

  if (!originalName) return null;

  // ==============================================
  // 1. CORRESPONDANCES EXACTES — PRIORITÉ ABSOLUE
  // ==============================================

  // ===== CONSERVERIE DE LÉGUMES =====
  // Ces correspondances doivent être testées AVANT
  // toutes les recherches partielles.
  if (originalName === "Remplisseuse-doseuse") return 'remplisseuse_doseuse';
  if (originalName === "Étiqeteuse") return 'etiqueteuse';
  if (originalName === "Etiqeteuse") return 'etiqueteuse';
  if (originalName === "Étiqueteuse") return 'etiqueteuse';
  if (originalName === "Etiqueteuse") return 'etiqueteuse';
  if (originalName === "Laveuse-découpeuse") return 'laveuse_decoupeuse';
  if (originalName === "Laveuse-decoupeuse") return 'laveuse_decoupeuse';
  if (originalName === "Blanchisseur") return 'blanchisseur';
  if (originalName === "Scelleuse-operculieuse") return 'scelleuse_operculieuse';
  if (originalName === "Autoclave") return 'autoclave';
  if (originalName === "Cartonneuse-emballeuse") return 'cartonneuse_emballeuse';


  // ===== BICYCLETTES =====
  if (originalName === "Poste soudure cadre" ||
      originalName === "Poste soudure") {
    return 'poste_soudure_cadre';
  }

  if (originalName === "Cabine peinture") {
    return 'cabine_peinture';
  }

  if (originalName === "Chaîne assemblage" ||
      originalName === "Chaine assemblage") {
    return 'chaine_assemblage_velos';
  }

  if (originalName === "Machine à monter roues" ||
      originalName === "Machine monter roues") {
    return 'machine_monter_roues';
  }

  if (originalName === "Poste réglage") {
    return 'poste_reglage';
  }

  if (originalName === "Banc de contrôle") {
    return 'banc_controle';
  }

  // Attention : "Poste emballage" existe également
  // dans l'assemblage PC. On conserve ici le comportement
  // historique de ta fonction pour les bicyclettes.
  if (originalName === "Poste emballage") {
    return 'poste_emballage_velos';
  }


  // ===== ASSEMBLAGE D'ORDINATEURS =====
  if (originalName === "Poste assemblage") {
    return 'poste_assemblage_pc';
  }

  if (originalName === "Machine à visser") {
    return 'machine_visser';
  }

  if (originalName === "Testeur alimentation") {
    return 'testeur_alimentation';
  }

  if (originalName === "Testeur mémoire RAM") {
    return 'testeur_ram';
  }

  if (originalName === "Brûleur BIOS") {
    return 'bruleur_bios';
  }

  // IMPORTANT :
  // On ne recherche surtout PAS simplement "os",
  // car "doseuse" contient "os".
  if (originalName === "Configuration OS") {
    return 'config_os';
  }

  if (originalName === "Poste emballage PC") {
    return 'poste_emballage_pc';
  }


  // ===== HUILES ALIMENTAIRES =====
  if (originalName === "Presse à huile" ||
      originalName === "Presse a huile") {
    return 'presse_huile';
  }

  if (originalName === "Nettoyeur-décortiqueur" ||
      originalName === "Nettoyeur-decortiqueur") {
    return 'nettoyeur_decortiqueur';
  }

  if (originalName === "Broyeur / Concasseur") {
    return 'broyeur_concasseur_huile';
  }

  if (originalName === "Cuiseur (optionnel)") {
    return 'cuiseur_huile';
  }

  if (originalName === "Filtre-presse") {
    return 'filtre_presse_huile';
  }

  if (originalName === "Clarificateur / Décanteuse") {
    return 'clarificateur_decanteuse';
  }

  if (originalName === "Remplisseuse-scelleuse") {
    return 'remplisseuse_huile';
  }

  if (originalName === "Neutraliseur (module raffinerie)") {
    return 'neutraliseur_huile';
  }

  if (originalName === "Décoloreur (module raffinerie)") {
    return 'decoloreur_huile';
  }

  if (originalName === "Désodoriseur (module raffinerie)") {
    return 'desodoriseur_huile';
  }

  if (originalName === "Fractionneur (module raffinerie)") {
    return 'fractionneur_huile';
  }


  // ===== JUS & BOISSONS =====
  if (originalName === "Éplucheuse-dénoyauteuse" ||
      originalName === "Eplucheuse-denoyauteuse") {
    return 'eplucheuse_denoyauteuse';
  }

  if (originalName === "Broyeur-raspeur") {
    return 'broyeur_raspeur';
  }

  if (originalName === "Filtreuse / Tamiseuse" ||
      originalName === "Filtreuse/Tamiseuse") {
    return 'filtreuse_tamiseuse';
  }

  if (originalName === "Mélangeuse / Doseuse" ||
      originalName === "Melangeuse / Doseuse") {
    return 'melangeuse_doseuse';
  }

  if (originalName === "Pasteurisateur") {
    return 'pasteurisateur';
  }

  if (originalName === "Concentrateur / Évaporateur" ||
      originalName === "Concentrateur/Evaporateur") {
    return 'concentrateur_evaporateur';
  }


  // ===== TRANSFORMATION D'ÉPICES =====
  if (originalName === "Laveuse-décanteuse") {
    return 'laveuse_decanteuse_epices';
  }

  if (originalName === "Séchoir") {
    return 'sechoir_epices';
  }

  if (originalName === "Broyeur (moulin à épices)") {
    return 'broyeur_epices';
  }

  if (originalName === "Tamiseuse vibrante") {
    return 'tamiseuse_epices';
  }

  if (originalName === "Mélangeuse (spice blender)") {
    return 'melangeuse_epices';
  }

  if (originalName === "Conditionneuse") {
    return 'conditionneuse_sachets';
  }

  if (originalName === "Étiqeteuse épices") {
    return 'etiqueteuse_epices';
  }

  if (originalName === "Étiqueteuse épices") {
    return 'etiqueteuse_epices';
  }

  if (originalName === "Laboratoire qualité (module innovation)") {
    return 'laboratoire_qualite';
  }

  if (originalName === "Micro-doseuse (module innovation)") {
    return 'micro_doseuse';
  }


  // ==============================================
  // 2. CORRESPONDANCES PARTIELLES SPÉCIFIQUES
  // ==============================================

  // ===== CONSERVERIE =====

  if (
    n.includes('laveuse') &&
    (n.includes('découpeuse') || n.includes('decoupeuse'))
  ) {
    return 'laveuse_decoupeuse';
  }

  if (
    n.includes('blanchisseur') ||
    n.includes('blanchiment')
  ) {
    return 'blanchisseur';
  }

  // Remplisseuse + doseuse = remplisseuse-doseuse
  // et NON melangeuse_doseuse.
  if (
    n.includes('remplisseuse') &&
    n.includes('doseuse')
  ) {
    return 'remplisseuse_doseuse';
  }

  if (
    n.includes('scelleuse') &&
    n.includes('operculieuse')
  ) {
    return 'scelleuse_operculieuse';
  }

  if (
    n.includes('autoclave') ||
    n.includes('stérilisateur') ||
    n.includes('sterilisateur')
  ) {
    return 'autoclave';
  }

  if (
    n.includes('étiqeteuse') ||
    n.includes('etiqeteuse') ||
    n.includes('étiqueteuse') ||
    n.includes('etiqueteuse')
  ) {
    return 'etiqueteuse';
  }

  if (
    n.includes('cartonneuse') &&
    n.includes('emballeuse')
  ) {
    return 'cartonneuse_emballeuse';
  }


  // ===== ASSEMBLAGE PC =====

  if (
    n.includes('poste assemblage') ||
    n === 'assemblage'
  ) {
    return 'poste_assemblage_pc';
  }

  if (
    n.includes('visser') ||
    n.includes('visseuse')
  ) {
    return 'machine_visser';
  }

  if (
    n.includes('testeur alimentation') ||
    n.includes('alimentation')
  ) {
    return 'testeur_alimentation';
  }

  if (
    n.includes('testeur mémoire') ||
    n.includes('testeur memoire') ||
    n.includes('testeur ram')
  ) {
    return 'testeur_ram';
  }

  if (n.includes('bios')) {
    return 'bruleur_bios';
  }

  // IMPORTANT :
  // "os" seul a été supprimé.
  if (
    n.includes('configuration os') ||
    n === 'config os'
  ) {
    return 'config_os';
  }


  // ===== HUILES =====

  if (
    n.includes('nettoyeur') ||
    n.includes('décortiqueur') ||
    n.includes('decortiqueur')
  ) {
    return 'nettoyeur_decortiqueur';
  }

  if (n.includes('concasseur')) {
    return 'broyeur_concasseur_huile';
  }

  if (
    (n.includes('broyeur') && n.includes('huile')) ||
    (n.includes('broyeur') && n.includes('graine'))
  ) {
    return 'broyeur_concasseur_huile';
  }

  if (n.includes('cuiseur')) {
    return 'cuiseur_huile';
  }

  if (
    n.includes('presse') &&
    n.includes('huile') &&
    !n.includes('filtre')
  ) {
    return 'presse_huile';
  }

  if (
    n.includes('filtre') &&
    n.includes('presse')
  ) {
    return 'filtre_presse_huile';
  }

  if (
    n.includes('clarificateur') ||
    n.includes('décanteuse') ||
    n.includes('decanteuse')
  ) {
    return 'clarificateur_decanteuse';
  }

  if (
    n.includes('remplisseuse') &&
    (
      n.includes('huile') ||
      n.includes('bidon')
    )
  ) {
    return 'remplisseuse_huile';
  }

  if (n.includes('neutraliseur')) {
    return 'neutraliseur_huile';
  }

  if (
    n.includes('décoloreur') ||
    n.includes('decoloreur')
  ) {
    return 'decoloreur_huile';
  }

  if (
    n.includes('désodoriseur') ||
    n.includes('desodoriseur')
  ) {
    return 'desodoriseur_huile';
  }

  if (n.includes('fractionneur')) {
    return 'fractionneur_huile';
  }


  // ===== JUS & BOISSONS =====

  if (
    n.includes('laveuse') ||
    n.includes('trieuse')
  ) {
    return 'laveuse_trieuse';
  }

  if (
    n.includes('éplucheuse') ||
    n.includes('eplucheuse') ||
    n.includes('dénoyauteuse') ||
    n.includes('denoyauteuse')
  ) {
    return 'eplucheuse_denoyauteuse';
  }

  if (
    n.includes('broyeur') ||
    n.includes('raspeur')
  ) {
    return 'broyeur_raspeur';
  }

  if (
    n.includes('filtreuse') ||
    n.includes('tamiseuse')
  ) {
    return 'filtreuse_tamiseuse';
  }

  // IMPORTANT :
  // "doseuse" seule ne suffit plus à déclencher
  // melangeuse_doseuse si le nom contient "remplisseuse".
  if (
    n.includes('mélangeuse') ||
    n.includes('melangeuse') ||
    (
      n.includes('doseuse') &&
      !n.includes('remplisseuse')
    )
  ) {
    return 'melangeuse_doseuse';
  }

  if (n.includes('pasteurisateur')) {
    return 'pasteurisateur';
  }

  // IMPORTANT :
  // "remplisseuse" OU "scelleuse" seul ne déclenche plus
  // cette famille.
  if (
    n.includes('remplisseuse') &&
    n.includes('scelleuse')
  ) {
    return 'remplisseuse_scelleuse';
  }

  if (
    n.includes('concentrateur') ||
    n.includes('évaporateur') ||
    n.includes('evaporateur')
  ) {
    return 'concentrateur_evaporateur';
  }


  // ===== BISCUITERIE =====

  if (
    n.includes('mélangeur') ||
    n.includes('melangeur') ||
    (
      n.includes('pétrin') &&
      n.includes('biscuit')
    )
  ) {
    return 'melangeur_biscuiterie';
  }

  if (n.includes('lamineuse')) {
    return 'lamineuse_biscuiterie';
  }

  if (
    (
      n.includes('façonneuse') ||
      n.includes('faconneuse')
    ) &&
    n.includes('rotative')
  ) {
    return 'faconneuse_rotative';
  }

  if (
    n.includes('four') &&
    (
      n.includes('biscuit') ||
      n.includes('biscuiterie')
    )
  ) {
    return 'four_biscuiterie';
  }

  if (n.includes('refroidisseur')) {
    return 'refroidisseur_biscuiterie';
  }

  if (
    n.includes('enrobeuse') ||
    n.includes('saupoudreuse')
  ) {
    return 'enrobeuse_saupoudreuse';
  }

  if (
    n.includes('emballeuse') &&
    n.includes('horizontale')
  ) {
    return 'emballeuse_horizontale';
  }


  // ===== BOULANGERIE =====

  if (
    n.includes('pétrin') ||
    n.includes('petrin')
  ) {
    return 'petrin_spiral';
  }

  if (n.includes('diviseuse')) {
    return 'diviseuse_bouleuse';
  }

  if (
    n.includes('façonneuse') ||
    n.includes('faconneuse')
  ) {
    return 'faconneuse';
  }

  if (
    n.includes('chambre') &&
    (
      n.includes('pousse') ||
      n.includes('fermentation')
    )
  ) {
    return 'chambre_pousse';
  }

  if (
    n.includes('four') &&
    (
      n.includes('tunnel') ||
      n.includes('rotatif')
    )
  ) {
    return 'four_tunnel';
  }

  if (n.includes('trancheuse')) {
    return 'trancheuse';
  }

  if (
    n.includes('emballeuse') ||
    n.includes('ensacheuse')
  ) {
    return 'emballeuse';
  }


  // ===== MINI-LAITERIE =====

  if (
    n.includes('cuve') &&
    n.includes('réception')
  ) {
    return 'cuve_reception';
  }

  if (n.includes('pasteurisateur')) {
    return 'pasteurisateur_lait';
  }

  if (
    n.includes('écrémeuse') ||
    n.includes('ecremeuse')
  ) {
    return 'ecremeuse';
  }

  if (n.includes('maturation')) {
    return 'cuve_maturation';
  }

  if (
    n.includes('remplisseuse') &&
    n.includes('lait')
  ) {
    return 'remplisseuse_lait';
  }

  if (
    n.includes('chambre') &&
    n.includes('froide')
  ) {
    return 'chambre_froide';
  }


  // ===== SMARTPHONES & TABLETTES =====

  if (
    n.includes('contrôle optique') ||
    n.includes('controle optique') ||
    n.includes('aoi')
  ) {
    return 'controle_optique';
  }

  if (n.includes('smt')) {
    return 'ligne_smt';
  }

  if (
    n.includes('four') &&
    n.includes('refusion')
  ) {
    return 'four_refusion';
  }

  if (
    n.includes('robot encollage') ||
    n.includes('encollage')
  ) {
    return 'robot_encollage';
  }

  if (
    n.includes('presse écran') ||
    n.includes('presse ecran') ||
    n.includes('presse_ecran')
  ) {
    return 'presse_ecran';
  }

  if (
    n.includes('testeur fonctionnel') ||
    n.includes('testeur_fonctionnel')
  ) {
    return 'testeur_fonctionnel_smartphone';
  }

  if (
    n.includes('imei') ||
    n.includes('étiqueter imei') ||
    n.includes('etiqueter imei')
  ) {
    return 'etiqueteuse_imei';
  }


  // ===== BICYCLETTES =====

  if (
    n.includes('soudure cadre') ||
    n === 'poste soudure'
  ) {
    return 'poste_soudure_cadre';
  }

  if (
    n.includes('cabine peinture') ||
    (
      n.includes('peinture') &&
      n.includes('cabine')
    )
  ) {
    return 'cabine_peinture';
  }

  if (
    n.includes('chaîne assemblage') ||
    n.includes('chaine assemblage')
  ) {
    return 'chaine_assemblage_velos';
  }

  if (
    n.includes('monter roues') ||
    n.includes('montage roues') ||
    n.includes('monte-roues')
  ) {
    return 'machine_monter_roues';
  }

  if (
    n.includes('poste réglage') ||
    n.includes('poste reglage')
  ) {
    return 'poste_reglage';
  }

  if (
    n.includes('banc de contrôle') ||
    n.includes('banc de controle') ||
    n.includes('banc contrôle') ||
    n.includes('banc controle') ||
    n.includes('test freinage')
  ) {
    return 'banc_controle';
  }


  // ==============================================
  // 3. AUTRES
  // ==============================================

  if (n.includes('granulateur')) {
    return 'granulateur';
  }

  if (
    n.includes('boulangerie') ||
    n.includes('boulangerie industrielle')
  ) {
    return 'petrin_spiral';
  }


  // ==============================================
  // AUCUNE CORRESPONDANCE
  // ==============================================

  return null;
}

async function demanderMiseEnRelation(productName, supplier, origin, modelId) {
  const email = getActiveEmail();
  if (!email) {
    alert('Veuillez vous connecter pour demander une mise en relation.');
    window.location.href = 'login.html?mode=login';
    return;
  }

  try {
    // 1. Récupérer l'utilisateur connecté via Supabase
    const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
    if (userError || !user) {
      alert('Erreur de connexion. Veuillez vous reconnecter.');
      window.location.href = 'login.html?mode=login';
      return;
    }

    // 2. Insérer la demande dans la table "user_contacts"
    const { data, error } = await supabaseClient
      .from('user_contacts')
      .insert({
        user_id: user.id,
        product_name: productName,
        supplier_name: supplier,
        origin: origin,
        model_id: modelId || 'Non spécifié',
        status: 'pending'
      })
      .select();

    if (error) {
      console.error('❌ Erreur Supabase:', error);
      alert('Erreur lors de l\'enregistrement de la demande.');
      return;
    }

    // 3. Succès
    const modal = document.getElementById('p2i-supplier-modal');
    if (modal) modal.remove();

   showToast(`✅ Demande de mise en relation avec ${supplier} enregistrée !`);

setTimeout(() => {
  window.location.href = 'dashboard.html#mes-mises-en-relation';
}, 1500);
  } catch(e) {
    console.error('❌ Erreur inattendue:', e);
    alert('Une erreur est survenue.');
  }
}
// ==============================================
// DEMANDER UNE ESTIMATION P2I
// ==============================================

async function demanderEstimationP2I(
  productName,
  supplier,
  origin,
  modelId,
  price,
  capacity,
  supplierStatus
) {

  const email = getActiveEmail();

  if (!email) {
    alert('Veuillez vous connecter pour demander une Estimation P2I.');
    window.location.href = 'login.html?mode=login';
    return;
  }

  try {

    // 1. Récupérer l'utilisateur connecté via Supabase
    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {
      alert('Erreur de connexion. Veuillez vous reconnecter.');
      window.location.href = 'login.html?mode=login';
      return;
    }


    // 2. Préparer le prix catalogue
    let catalogPrice = null;

    if (price !== null && price !== undefined && price !== '') {
      const parsedPrice = Number(price);

      if (!isNaN(parsedPrice)) {
        catalogPrice = parsedPrice;
      }
    }


    // 3. Insérer la demande d'Estimation P2I
    const { data, error } = await supabaseClient
      .from('p2i_estimations')
      .insert({
        user_id: user.id,

        product_name: productName,
        supplier_name: supplier || null,
        model_id: modelId || null,
        origin: origin || null,
        capacity: capacity || null,

        supplier_status: supplierStatus || 'identified',

        catalog_price_usd: catalogPrice,

        // L'estimation vient d'être demandée
        estimation_status: 'pending'
      })
      .select();

    if (error) {
      console.error('❌ Erreur Supabase Estimation P2I:', error);

      alert(
        'Erreur lors de l’enregistrement de votre demande d’Estimation P2I.'
      );

      return;
    }


    // 4. Fermer le modal
    const modal = document.getElementById('p2i-supplier-modal');

    if (modal) {
      modal.remove();
    }


    // 5. Confirmation
    showToast(
      `✅ Votre demande d’Estimation P2I pour ${productName} a été enregistrée !`
    );


    // 6. Redirection vers Mes demandes / Mes estimations
    setTimeout(() => {
      window.location.href = 'dashboard.html#mes-demandes';
    }, 1500);


  } catch (e) {

    console.error(
      '❌ Erreur inattendue lors de la demande d’Estimation P2I:',
      e
    );

    alert(
      'Une erreur est survenue lors de la demande d’Estimation P2I.'
    );
  }
}

// ==============================================

function sauvegarderMachinePourPlusTard(productName, supplier, origin) {
  const email = getActiveEmail();
  if (!email) {
    alert('Veuillez vous connecter pour sauvegarder cette machine.');
    window.location.href = 'login.html?mode=login';
    return;
  }
  
  const savedKey = `p2i_saved_machines_${email}`;
  let saved = JSON.parse(localStorage.getItem(savedKey) || '[]');
  
  if (saved.some(item => item.product === productName && item.supplier === supplier)) {
    showToast(`ℹ️ "${productName}" est déjà dans vos favoris.`);
    return;
  }
  
  saved.push({
    id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
    product: productName,
    supplier: supplier,
    origin: origin,
    date: new Date().toISOString()
  });
  
  localStorage.setItem(savedKey, JSON.stringify(saved));
  
  const modal = document.getElementById('p2i-supplier-modal');
  if (modal) modal.remove();
  
  showToast(`✅ "${productName}" sauvegardé dans vos favoris !`);
}

    max-width: 90vw;

  toast.textContent = message;
  document.body.appendChild(toast);
  
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

    let selectedOrigins = {}; // { modelId: { origin, price } }

    function selectModelOrigin(element, modelId, origin, price) {
      const parent = element.closest('.origin-options');
      parent.querySelectorAll('.origin-option').forEach(opt => {
        opt.classList.remove('selected');
      });
      
      element.classList.add('selected');
      selectedOrigins[modelId] = { origin, price };
      
      const card = element.closest('.model-card');
      const actions = card.querySelectorAll('.model-actions button');
      const labels = { korean: '🇰🇷 Corée', chinese: '🇨🇳 Chine', europe: '🇪🇺 Europe' };
      
      actions.forEach(btn => {
        const action = btn.textContent.trim();
        if (action.includes('Devis')) {
          btn.innerHTML = `<i class="fas fa-file-invoice"></i> Devis (${labels[origin]})`;
        } else if (action.includes('Panier')) {
          btn.innerHTML = `<i class="fas fa-cart-plus"></i> Panier (${labels[origin]})`;
        } else if (action.includes('Enregistrer')) {
          btn.innerHTML = `<i class="fas fa-save"></i> Enregistrer (${labels[origin]})`;
        }
        btn.dataset.origin = origin;
        btn.dataset.price = price;
      });
    }

    function getSelectedOrigin(element) {
      const card = element.closest('.model-card');
      const modelId = card?.querySelector('.origin-options')?.dataset.model;
      if (modelId && selectedOrigins[modelId]) {
        return selectedOrigins[modelId];
      }
      return { origin: 'chinese', price: null };
    }

      window.location.href = url;
    }

    function addToCartWithOrigin(modelName, btn) {
      const selection = getSelectedOrigin(btn);
      const price = selection.price || 'Prix sur demande';
      const origin = selection.origin || 'chinese';
      const labels = { korean: '🇰🇷 Premium Corée', chinese: '🇨🇳 Standard Chine', europe: '🇪🇺 Occasion Europe' };
      
      cart.push({ 
        name: `${modelName} (${labels[origin] || origin})`, 
        price: price, 
        origin: origin,
        date: new Date().toISOString() 
      }); 
      saveCart(); 
      showToast(`✓ "${modelName}" (${labels[origin]}) ajouté au panier`); 
      renderCartModal();
    }

async function saveToDashboardWithOrigin(
  upId,
  upNom,
  machineName,
  modelName,
  machineRole,
  machineCapacity,
  machineUtilities,
  modelId,
  supplier,
  supplierStatus,
  origin,
  priceTtc,
  btn
) {
  const email = getActiveEmail();

  if (!email) {
    alert('Veuillez vous connecter.');
    window.location.href = 'login.html?mode=login';
    return;
  }

  console.log('🔍 1. Début de la sauvegarde pour:', email);

  try {

    // ==============================================
    // 1. RÉCUPÉRATION DE L'UTILISATEUR SUPABASE
    // ==============================================

    console.log('🔍 2. Récupération de l\'utilisateur Supabase...');

    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError) {
      console.error('❌ Erreur utilisateur:', userError);
      alert('Erreur de connexion.');
      return;
    }

    if (!user) {
      console.log('❌ Utilisateur non connecté');
      alert('Veuillez vous reconnecter.');
      window.location.href = 'login.html?mode=login';
      return;
    }

    console.log('✅ 3. Utilisateur trouvé:', user.id, user.email);


    // ==============================================
    // 2. ORIGINE ET PRIX DU MODÈLE SÉLECTIONNÉ
    // ==============================================

    origin = origin || 'chinese';

    const price = priceTtc || 'Prix sur demande';

    const labels = {
      korean: '🇰🇷 Premium Corée',
      chinese: '🇨🇳 Standard Chine',
      europe: '🇪🇺 Occasion Europe'
    };

    console.log('🌍 Origine du modèle:', origin);
    console.log('💰 Prix catalogue:', price);


    // ==============================================
    // 3. CONSTRUCTION DES DONNÉES DE LA MACHINE
    // ==============================================

    const machineData = {

      // ----------------------------------------------
      // UNITÉ DE PRODUCTION
      // ----------------------------------------------

      up_id: upId,
      up_nom: upNom,

      // ----------------------------------------------
      // MACHINE / MODÈLE
      // ----------------------------------------------

      machine: machineName,
      model: modelName,
      model_id: modelId || null,

      // ----------------------------------------------
      // FOURNISSEUR
      // ----------------------------------------------

      supplier: supplier || null,
      supplier_status: supplierStatus || 'identified',

      // ----------------------------------------------
      // PRIX CATALOGUE
      // ----------------------------------------------

      catalog_price_usd: price,

      // ----------------------------------------------
      // ORIGINE
      // ----------------------------------------------

      origin: origin,
      origin_label: labels[origin] || origin,

      // ----------------------------------------------
      // CARACTÉRISTIQUES
      // ----------------------------------------------

      machine_role: machineRole,
      machine_capacity: machineCapacity,
      machine_utilities: machineUtilities,

      // ----------------------------------------------
      // STATUTS P2I
      // ----------------------------------------------

      estimation_status: 'pending',
      relation_status: 'pending',

      // ----------------------------------------------
      // DATE D'ENREGISTREMENT
      // ----------------------------------------------

      saved_at: new Date().toISOString()
    };


    console.log('📦 4. Données à sauvegarder:', machineData);


    // ==============================================
    // 4. SAUVEGARDE DANS SUPABASE
    // ==============================================

    console.log(
      '🔍 5. Tentative de sauvegarde dans saved_machines...'
    );

    const {
      data: insertData,
      error
    } = await supabaseClient
      .from('saved_machines')
      .insert({
        user_id: user.id,
        data: machineData
      })
      .select();


    // ==============================================
    // 5. GESTION D'ERREUR
    // ==============================================

    if (error) {

      console.error(
        '❌ 6. Erreur sauvegarde Supabase:',
        error
      );

      console.error(
        '❌ Détails:',
        JSON.stringify(error, null, 2)
      );

      alert(
        '❌ Erreur lors de l\'enregistrement: ' +
        error.message
      );

      return;
    }


    // ==============================================
    // 6. SUCCÈS
    // ==============================================

    console.log(
      '✅ 7. Machine sauvegardée avec succès:',
      insertData
    );

    console.log(
      '📦 Données enregistrées dans saved_machines:',
      machineData
    );


    showToast(
      `✅ "${modelName}" (${labels[origin] || origin}) enregistré dans le Dashboard`
    );


    // ==============================================
    // 7. RETOUR VERS MES MACHINES
    // ==============================================

    setTimeout(() => {
      window.location.href =
        'dashboard.html#mes-machines';
    }, 1500);

  } catch (e) {

    console.error(
      '❌ Erreur inattendue:',
      e
    );

   alert(
  "❌ Erreur lors de l'enregistrement."
);
  }
}

    // ==============================================
    // GESTION DU PANIER
    // ==============================================

    function loadCart() { const saved = localStorage.getItem('p2i_machines_cart'); if (saved) try { cart = JSON.parse(saved); } catch(e) { cart = []; } updateCartBadge(); }
    function saveCart() { localStorage.setItem('p2i_machines_cart', JSON.stringify(cart)); updateCartBadge(); }
    function updateCartBadge() { document.getElementById('cartCount').textContent = cart.length; }
    function removeFromCart(index) { cart.splice(index, 1); saveCart(); renderCartModal(); showToast("Article retiré du panier"); }
    
    function renderCartModal() {
      const container = document.getElementById('cartItemsList');
      const totalSpan = document.getElementById('cartTotalDisplay');
      if (!container) return;
      if (cart.length === 0) { container.innerHTML = '<div class="empty-cart">Aucun article</div>'; totalSpan.innerHTML = '<span>Total TTC</span><span>0 $</span>'; return; }
      let total = 0;
      container.innerHTML = cart.map((item, idx) => { 
        total += typeof item.price === 'number' ? item.price : 0; 
        return `<div class="cart-item"><div class="cart-item-info"><div class="cart-item-name">${escapeHtml(item.name)}</div><div class="cart-item-price">${typeof item.price === 'number' ? item.price.toLocaleString() : item.price} $</div></div><button class="cart-item-remove" onclick="removeFromCart(${idx})"><i class="fas fa-trash"></i></button></div>`; 
      }).join('');
      totalSpan.innerHTML = `<span>Total TTC</span><span>${total.toLocaleString()} $</span>`;
    }
    
    function openCartModal() { document.getElementById('cartModal').style.display = 'flex'; renderCartModal(); }
    function closeCartModal() { document.getElementById('cartModal').style.display = 'none'; }
    
    function checkoutCart() {
      if (cart.length === 0) { alert('Votre panier est vide.'); return; }
      const useAlibaba = confirm(`🛒 ${cart.length} article(s) dans votre panier.\n\n• OK → Alibaba (Trade Assurance)\n• Annuler → Made-in-China (Secure Payment)`);
      const searchTerms = cart.map(item => encodeURIComponent(item.name)).join('+');
      const url = useAlibaba ? `https://www.alibaba.com/trade/search?SearchText=${searchTerms}` : `https://fr.made-in-china.com/recherche/recherche.do?word=${searchTerms}`;
      window.open(url, '_blank');
      
      const email = getActiveEmail();
      if (email) {
        const order = { id: 'order_' + Date.now(), date: new Date().toISOString(), items: [...cart], platform: useAlibaba ? 'Alibaba' : 'Made-in-China' };
        let orders = JSON.parse(localStorage.getItem(`p2i_orders_${email}`) || '[]');
        orders.push(order);
        localStorage.setItem(`p2i_orders_${email}`, JSON.stringify(orders));
      }
      
      cart = [];
      saveCart();
      closeCartModal();
      showToast("Redirection vers la plateforme de vente");
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.opacity = '1';
      setTimeout(() => t.style.opacity = '0', 3000);
    }

function goBack() {
  const urlParams = new URLSearchParams(window.location.search);

  const source = urlParams.get('source');

  // ==============================================
  // RETOUR DEPUIS "MES MACHINES"
  // ==============================================

  if (source === 'mes-machines') {
    window.location.href = 'dashboard.html#mes-machines';
    return;
  }

  // ==============================================
  // COMPORTEMENT NORMAL :
  // RETOUR À LA PAGE PRÉCÉDENTE
  // ==============================================

  if (window.history.length > 1) {
    window.history.back();
    return;
  }

  // ==============================================
  // SÉCURITÉ :
  // SI AUCUN HISTORIQUE N'EST DISPONIBLE
  // ==============================================

  window.location.href = 'service-achat-machines.html';
}

    function init() {
      const params = getUrlParams();
      displayMachineInfo(params);
      displayModels(params);
      loadCart();
      
      window.addToCart = addToCartWithOrigin;
      window.removeFromCart = removeFromCart;
      window.saveToDashboard = saveToDashboardWithOrigin;
      window.checkoutCart = checkoutCart;
      window.goBack = goBack;
      window.openCartModal = openCartModal;
      window.closeCartModal = closeCartModal;
      window.requestQuoteWithOrigin = requestQuoteWithOrigin;
      window.selectModelOrigin = selectModelOrigin;
      window.getSelectedOrigin = getSelectedOrigin;
    }
    
    // Lancer l'initialisation
    document.addEventListener('DOMContentLoaded', init);
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      init();
    }
