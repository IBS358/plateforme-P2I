<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>P2I - Administration | Validation des offres</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
        }
        
        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(to right, #4cc9f0, #f72585);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #b8c1ec;
            font-size: 0.9rem;
        }
        
        .stats {
            background: rgba(76, 201, 240, 0.15);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid rgba(76, 201, 240, 0.3);
        }
        
        .stats .count {
            font-size: 2.5rem;
            font-weight: bold;
            color: #4cc9f0;
        }
        
        .stats .label {
            color: #b8c1ec;
            font-size: 0.85rem;
        }
        
        .offre-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        
        .offre-card:hover {
            transform: translateY(-2px);
            border-color: #4cc9f0;
            background: rgba(255, 255, 255, 0.12);
        }
        
        .offre-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #4cc9f0;
            margin-bottom: 12px;
            border-left: 3px solid #f72585;
            padding-left: 12px;
        }
        
        .offre-detail {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
            padding: 10px 0;
        }
        
        .detail-item {
            flex: 1;
            min-width: 150px;
        }
        
        .detail-label {
            font-size: 0.7rem;
            color: #b8c1ec;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .detail-value {
            font-size: 0.95rem;
            color: white;
            font-weight: 500;
            word-break: break-word;
        }
        
        .offre-description {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 12px;
            margin: 12px 0;
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.5;
        }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        
        .badge-waiting {
            background: rgba(247, 37, 133, 0.2);
            color: #f72585;
            border: 1px solid #f72585;
        }
        
        .badge-paid {
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
            border: 1px solid #28a745;
        }
        
        .badge-unpaid {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
            border: 1px solid #ffc107;
        }
        
        .btn-validate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #28a745, #20c997);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .btn-validate:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.3);
        }
        
        .btn-confirm-payment {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ffc107, #fd7e14);
            color: #1a1a2e;
            border: none;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }
        
        .btn-confirm-payment:hover {
            transform: translateY(-2px);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
        }
        
        .empty-state p {
            color: #b8c1ec;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 30px;
            text-align: center;
            width: 100%;
            color: #4cc9f0;
            text-decoration: none;
            padding: 12px;
            border: 1px solid #4cc9f0;
            border-radius: 12px;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .back-link:hover {
            background: rgba(76, 201, 240, 0.1);
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #28a745;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 1100;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        
        @media (max-width: 600px) {
            body { padding: 15px; }
            .offre-detail { flex-direction: column; gap: 8px; }
            .toast { white-space: normal; text-align: center; width: 90%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔧 Administration P2I</h1>
            <p>Validation des offres d'emploi et gestion des paiements</p>
        </div>
        
        <div id="stats" class="stats">
            <div class="count" id="pendingCount">0</div>
            <div class="label">offre(s) en attente de validation</div>
        </div>
        
        <div id="offresList"></div>
        
        <a href="#" id="backToDashboard" class="back-link">← Retour au Dashboard</a>
    </div>
    
    <div id="toast" class="toast">✅ Action effectuée !</div>

    <script>
        const DB_KEY = 'p2i_reseau_data_v3';
        
        function getActiveEmail() {
            return localStorage.getItem('p2i_user_email') || 
                   localStorage.getItem('p2i_active_user') || 
                   sessionStorage.getItem('p2i_user_email') ||
                   localStorage.getItem('user_email') ||
                   sessionStorage.getItem('user_email');
        }
        
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.backgroundColor = isError ? '#dc3545' : '#28a745';
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2500);
        }
        
        function getDatabase() {
            const defaultDB = { cvs: [], offres: [] };
            const saved = localStorage.getItem(DB_KEY);
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch(e) {
                    return defaultDB;
                }
            }
            return defaultDB;
        }
        
        function saveDatabase(db) {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
        }
        
        function confirmerPaiement(offreId) {
            const db = getDatabase();
            const offreIndex = db.offres.findIndex(o => o.id === offreId);
            
            if (offreIndex === -1) {
                showToast('❌ Offre non trouvée', true);
                return;
            }
            
            db.offres[offreIndex].paiement.statut = 'paye';
            db.offres[offreIndex].paiement.datePaiement = new Date().toISOString();
            db.offres[offreIndex].paiement.transactionId = 'MAN_' + Date.now();
            saveDatabase(db);
            
            showToast('✅ Paiement confirmé ! Vous pouvez maintenant valider l\'offre.');
            afficherOffres();
        }
        
        function validerOffre(offreId) {
            const db = getDatabase();
            const offreIndex = db.offres.findIndex(o => o.id === offreId);
            
            if (offreIndex === -1) {
                showToast('❌ Offre non trouvée', true);
                return;
            }
            
            if (db.offres[offreIndex].paiement?.statut !== 'paye') {
                showToast('⚠️ Veuillez d\'abord confirmer le paiement', true);
                return;
            }
            
            if (db.offres[offreIndex].statut === 'active') {
                showToast('⚠️ Cette offre est déjà active', true);
                return;
            }
            
            db.offres[offreIndex].statut = 'active';
            saveDatabase(db);
            
            showToast('✅ Offre validée et maintenant visible publiquement !');
            afficherOffres();
        }
        
        function afficherOffres() {
            const db = getDatabase();
            const offresEnAttente = db.offres.filter(o => o.statut === 'en_attente_validation');
            
            document.getElementById('pendingCount').innerText = offresEnAttente.length;
            
            const container = document.getElementById('offresList');
            
            if (offresEnAttente.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 3rem;">🎉</div>
                        <p>Aucune offre en attente de validation</p>
                        <p style="font-size: 0.8rem; margin-top: 10px;">Toutes les offres ont été traitées</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            offresEnAttente.forEach((offre) => {
                const estPaye = offre.paiement?.statut === 'paye';
                
                html += `
                    <div class="offre-card" data-id="${offre.id}">
                        <span class="badge ${estPaye ? 'badge-paid' : 'badge-unpaid'}">
                            ${estPaye ? '✅ Paiement confirmé' : '⏳ En attente de paiement'}
                        </span>
                        <div class="offre-title">${escapeHtml(offre.poste || 'Sans titre')}</div>
                        
                        <div class="offre-detail">
                            <div class="detail-item">
                                <div class="detail-label">🏢 Entreprise</div>
                                <div class="detail-value">${escapeHtml(offre.entreprise || '-')}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">🏛️ N° RCCM</div>
                                <div class="detail-value">${escapeHtml(offre.rccm || '-')}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">📊 N° IFU</div>
                                <div class="detail-value">${escapeHtml(offre.ifu || '-')}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">📎 KBIS / Justificatif</div>
                                <div class="detail-value">
                                    ${offre.kbisBase64 ? 
                                        `<a href="${offre.kbisBase64}" download="${offre.kbisFileName || 'KBIS.pdf'}" style="color:#4cc9f0; text-decoration:underline;">
                                            📄 Télécharger le justificatif (${offre.kbisFileName || 'PDF'})
                                        </a>` : 
                                        '<span style="color:#f72585;">❌ Fichier non disponible</span>'}
                                </div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">📍 Localisation</div>
                                <div class="detail-value">${escapeHtml(offre.localisation || '-')}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">🏭 Filière</div>
                                <div class="detail-value">${escapeHtml(offre.filiere || '-')}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">📞 Contact</div>
                                <div class="detail-value">${escapeHtml(offre.contact || '-')}</div>
                            </div>
                        </div>
                        
                        <div class="offre-description">
                            <strong>📋 Description du poste :</strong><br>
                            ${escapeHtml(offre.description || 'Aucune description')}
                        </div>
                        
                        <div class="offre-detail" style="margin-top: 5px;">
                            <div class="detail-item">
                                <div class="detail-label">📅 Date de dépôt</div>
                                <div class="detail-value">${offre.datePublication || '-'}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">💰 Montant</div>
                                <div class="detail-value">${offre.paiement?.montant || 6500} FCFA</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">💳 Statut paiement</div>
                                <div class="detail-value">${estPaye ? 'Payé' : 'Non payé'}</div>
                            </div>
                        </div>
                        
                        ${!estPaye ? `
                            <button class="btn-confirm-payment" onclick="confirmerPaiement('${offre.id}')">
                                💰 Confirmer le paiement (6 500 FCFA)
                            </button>
                        ` : ''}
                        
                        <button class="btn-validate" onclick="validerOffre('${offre.id}')" ${!estPaye ? 'style="opacity:0.6;"' : ''}>
                            ✅ Valider et publier cette offre
                        </button>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        // Gestion du bouton retour au dashboard
        document.getElementById('backToDashboard')?.addEventListener('click', (e) => {
            e.preventDefault();
            const userEmail = getActiveEmail();
            if (userEmail) {
                window.location.href = 'dashboard.html';
            } else {
                window.location.href = 'login.html?mode=login&redirect=' + encodeURIComponent('dashboard.html');
            }
        });
        
        document.addEventListener('DOMContentLoaded', afficherOffres);
    </script>
</body>
</html>
