    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return { upId: params.get('up'), upNom: params.get('nom') };
    }
    
    function formatNumber(value) {
      return parseInt(value).toLocaleString('fr-FR');
    }
    
    function calculerROI(caMin, capex, margeMin) {
      const beneficeAnnuel = caMin * (margeMin / 100);
      const roi = (beneficeAnnuel / capex) * 100;
      const payback = capex / beneficeAnnuel;
      return { roi: Math.round(roi), payback: payback.toFixed(1) };
    }
    
    function getActiveEmail() {
      return localStorage.getItem('p2i_user_email') || localStorage.getItem('p2i_active_user') || '';
    }
    
    function checkBpProExists(upId) {
  try {
    const email = getActiveEmail() || 'guest';
    const storageKey = `p2i_business_plans__${email}`;
    const plans = JSON.parse(localStorage.getItem(storageKey) || '[]');
    
    // Chercher par ID ou par nom
    const bpPro = plans.find(p => {
      if (p.type !== 'BP_PRO') return false;
      if (p.unit_id === upId) return true;
      if (p.unit === currentUpData?.nom) return true;
      return false;
    });
    
    if (bpPro) {
      return { exists: true, score: bpPro.score || 0, validated: bpPro.validated || false, data: bpPro };
    }
    return { exists: false, score: 0, validated: false, data: null };
  } catch(e) { 
    return { exists: false, score: 0, validated: false, data: null }; 
  }
}

    }

    function saveChecklistState() { localStorage.setItem(`tutoriel_checklist_${currentUp}`, JSON.stringify(checklistState)); }
    
    function toggleChecklistItem(stepIdx) {
      checklistState[stepIdx] = !checklistState[stepIdx];
      saveChecklistState();
      renderStep(currentStep);
      updateProgress();
      updateStepSummary();
    }
    
    function updateProgress() {
      const progress = (currentStep / totalSteps) * 100;
      const progressBar = document.getElementById('progressBar');
      if (progressBar) progressBar.style.width = `${progress}%`;
      const checkedCount = Object.values(checklistState).filter(v => v === true).length;
      const stepsValidated = document.getElementById('stepsValidated');
      if (stepsValidated) stepsValidated.innerHTML = `${checkedCount}/${totalSteps}`;
    }
    
    function updateStepSummary() {
      for (let i = 1; i <= totalSteps; i++) {
        const pill = document.querySelector(`.step-pill[data-step="${i}"]`);
        if (pill) checklistState[i-1] ? pill.classList.add('checked') : pill.classList.remove('checked');
      }
    }
    
    function goToStep(step) {
      if (step < 1) step = 1;
      if (step > totalSteps) step = totalSteps;
      currentStep = step;
      renderStep(currentStep);
      updateProgress();
      updateStepSummary();
      document.querySelectorAll('.step-pill').forEach(pill => {
        pill.classList.remove('active');
        if (parseInt(pill.dataset.step) === currentStep) pill.classList.add('active');
      });
    }
    
    function nextStep() { if (currentStep < totalSteps) goToStep(currentStep + 1); }
    function prevStep() { if (currentStep > 1) goToStep(currentStep - 1); }
    
    function renderStep(stepIdx) {
      const step = stepsList[stepIdx - 1];
      if (!step) return;
      const isChecked = checklistState[stepIdx - 1] || false;
      const checklistHtml = `
        <div class="checklist">
          <h4><i class="fas fa-check-double"></i> Validation de l'étape</h4>
          <div class="checklist-item ${isChecked ? 'checked' : ''}" onclick="toggleChecklistItem(${stepIdx - 1})">
            <i class="fas ${isChecked ? 'fa-check-circle' : 'fa-circle'}"></i>
            <span>${isChecked ? 'Étape validée' : 'Marquer cette étape comme terminée'}</span>
          </div>
        </div>
      `;
      const html = `
        <div class="step-card">
          <div class="step-number">${stepIdx}</div>
          <div class="step-icon"><i class="${step.icon}"></i></div>
          <h2 class="step-title">${step.title}</h2>
          <div class="step-content">
            ${step.content}
            ${checklistHtml}
            ${step.incitation}
          </div>
        </div>
      `;
      document.getElementById('stepContent').innerHTML = html;
    }
    
    function renderStepSummary() {
      const stepIcons = [
        { icon: "fas fa-info-circle", label: "Présentation" },
        { icon: "fas fa-microchip", label: "Machines" },
        { icon: "fas fa-cogs", label: "Processus" },

        { icon: "fas fa-lightbulb", label: "Astuces" }
      ];
      let summaryHtml = '<div class="step-summary">';
      for (let i = 0; i < stepIcons.length; i++) {
        const stepNum = i + 1;
        const isChecked = checklistState[i] || false;
        const isActive = currentStep === stepNum;
        summaryHtml += `
          <div class="step-pill ${isActive ? 'active' : ''} ${isChecked ? 'checked' : ''}" data-step="${stepNum}" onclick="goToStep(${stepNum})">
            <i class="step-pill-icon ${stepIcons[i].icon}"></i>
            <span class="step-pill-number">${stepNum}</span>
          </div>

      summaryHtml += '</div>';

    }

          ${bpStatus.score >= 76 ? '<span class="eligible">✅ Éligible au Tutoriel Expert Premium</span>' : '<span class="not-eligible">⚠️ Score insuffisant (76 requis)</span>'}
        </div>
        <a href="${getBpProFixedUrl(currentUp)}" class="btn-bp" style="display: inline-block; text-decoration: none; text-align: center; background: linear-gradient(135deg, #4cc9f0, #f72585); color: white; padding: 10px 24px; border-radius: 10px; font-weight: bold;">Améliorer mon BP Pro</a>
        ${bpStatus.score >= 76 && !bpStatus.validated ? `<button class="btn-validate" onclick="validateBpPro('${currentUp}')">VALIDER</button>` : ''}
      </div>
    `;
  } else {
    bpBannerHtml = `
      <div class="bp-status-banner">
        <div class="info">
          <i class="fas fa-info-circle" style="color: #fbbf24; font-size: 1.2rem;"></i>
          <span><strong>Aucun Business Plan Pro trouvé</strong></span>
          <span class="not-eligible">Le Tutoriel Expert Premium nécessite un BP Pro (score ≥ 76)</span>
        </div>
        <a href="${getBpProFixedUrl(currentUp)}" class="btn-bp" style="display: inline-block; text-decoration: none; text-align: center; background: linear-gradient(135deg, #4cc9f0, #f72585); color: white; padding: 10px 24px; border-radius: 10px; font-weight: bold;">Créer mon BP Pro</a>
      </div>
    `;
  }
  
  const headerHtml = `
    <div class="header">
      <div class="icon-main"><i class="fas fa-graduation-cap"></i></div>
      <h1>Tutoriel Découverte</h1>
      <div class="badge">GRATUIT</div>
      <div class="up-info">${data.nom}</div>
      <div class="filiere-info">Filière : ${data.filiereNom}</div>
    </div>
    <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
      <button id="saveTutorielBtn" class="btn-save" onclick="saveTutorielToDashboard()"><i class="fas fa-save"></i> Enregistrer ce tutoriel</button>
    </div>
    ${bpBannerHtml}
    <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
    <div class="progress-stats"><span>📊 Progression : <span id="progressPercent">0</span>%</span><span>✅ Étapes validées : <span id="stepsValidated">0/${totalSteps}</span></span></div>
    <div id="stepSummary"></div>
    <div id="stepContent"></div>
    <div class="nav-buttons"><button class="nav-btn" onclick="prevStep()"><i class="fas fa-arrow-left"></i> Étape précédente</button><button class="nav-btn nav-btn-primary" onclick="nextStep()">Étape suivante <i class="fas fa-arrow-right"></i></button></div>
    <div class="expert-section">
      <h3><i class="fas fa-crown"></i> Tutoriel Expert Premium</h3>
      <p>Version complète avec vidéos, checklists, support personnalisé, analyses financières, scoring IA, plans 3D, stratégie marketing...</p>
      <div class="expert-price">299 $</div>
      ${bpStatus.validated ? `<button class="btn-expert" onclick="redirectToPayment('${currentUp}', '${data.nom}')">Débloquer l'Expert Premium (299$)</button>` : `<button class="btn-expert" disabled><i class="fas fa-lock"></i> ${bpStatus.exists ? 'Validez votre BP Pro (score ≥ 76)' : 'Créez votre BP Pro pour débloquer'}</button>`}
    </div>
  `;
  
  document.getElementById('content').innerHTML = headerHtml;
  loadChecklistState();
  renderStepSummary();
  renderStep(currentStep);
  updateProgress();
}
    
    function init() {
  const { upId } = getUrlParams();
  console.log("🔍 upId reçu:", upId);
  console.log("📋 productionsData disponible:", Object.keys(productionsData));
  
  if (!upId) {
    document.getElementById('content').innerHTML = `<div class="header"><h1>Unité non spécifiée</h1><button onclick="goBack()" class="btn-back">Retour aux services</button></div>`;
    return;
  }
  currentUp = upId;
  
  if (productionsData[upId]) {
    currentUpData = productionsData[upId];
    console.log("✅ UP trouvée:", upId);
    currentStep = 1;
    renderFullTutoriel();
  } else {
    document.getElementById('content').innerHTML = `
      <div class="header">
        <h1>Unité non trouvée</h1>
        <p>ID: ${upId}</p>
        <p>UP disponibles: ${Object.keys(productionsData).join(', ')}</p>
        <button onclick="goBack()" class="btn-back">Retour aux services</button>
      </div>
    `;
  }
}
    
    window.goBack = goBack;
    window.requestQuote = requestQuote;
    window.requestGlobalQuote = requestGlobalQuote;
    window.redirectToBpPro = redirectToBpPro;
    window.validateBpPro = validateBpPro;
    window.saveTutorielToDashboard = saveTutorielToDashboard;
    window.prevStep = prevStep;
    window.nextStep = nextStep;
    window.goToStep = goToStep;
    window.toggleChecklistItem = toggleChecklistItem;
    
    init();
  </script>
</body>
</html>
